<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>夢淵 · 開發者模式</title>
<style>
:root{color-scheme:dark;font:14px/1.5 system-ui,sans-serif;background:#0b1119;color:#e8dfce}*{box-sizing:border-box}body{margin:0;height:100dvh;overflow:hidden}button,a{font:inherit}button{border:1px solid #695d42;background:#24271f;color:#e8dfce;border-radius:6px;padding:7px 12px;cursor:pointer}button:hover{border-color:#d2b674}button:disabled{opacity:.45;cursor:wait}a{color:#d2b674}.dev-bar{height:54px;display:flex;align-items:center;gap:12px;padding:8px 16px;border-bottom:1px solid #5b4b30;background:#171c23}.dev-brand{font-weight:700;letter-spacing:.06em}.dev-brand small{font-size:11px;color:#b2a184;margin-left:9px}.dev-bar .spacer{flex:1}.muted{color:#aab3bd;font-size:12px}.dev-game{display:block;border:0;width:100%;height:calc(100dvh - 54px);background:#0b1119}.dev-dock{position:fixed;right:0;top:54px;bottom:0;width:min(650px,48vw);background:#111820;border-left:1px solid #9b8454;box-shadow:-14px 0 40px #0008;z-index:10;display:flex;flex-direction:column}.dev-dock[hidden]{display:none}.dock-head{padding:14px;border-bottom:1px solid #4d493a}.dock-title{display:flex;align-items:center;justify-content:space-between;gap:10px}.dock-title h1{font-size:17px;margin:0}.dock-actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}.dev-editor{flex:1;min-height:0;border:0;width:100%;background:#111820}#devStatus{position:fixed;left:16px;bottom:12px;max-width:min(600px,calc(100vw - 32px));padding:8px 12px;border:1px solid #695d42;border-radius:6px;background:#171c23ed;z-index:20;white-space:pre-wrap}#devStatus:empty{display:none}.audit-link{font-size:12px}@media(max-width:700px){.dev-bar{gap:7px;padding:7px 9px}.dev-brand small,.dev-bar>.muted{display:none}.dev-dock{width:100%}.dev-bar button{padding:7px 9px}.audit-link{display:none}}
</style>
<header class="dev-bar"><span class="dev-brand">夢淵<small>開發者模式</small></span><span class="muted">測試進度獨立保存於本次預覽</span><span class="spacer"></span><a class="audit-link" href="/v2-audit" target="_blank" rel="noopener">稽核報告</a><button id="devOpen" disabled>編輯目前畫面</button></header>
<iframe id="devGame" class="dev-game" title="夢淵遊戲預覽" src="/v2-game/"></iframe>
<aside id="devDock" class="dev-dock" hidden aria-label="開發設定"><div class="dock-head"><div class="dock-title"><h1 id="devContext">開發設定</h1><button id="devClose" aria-label="關閉開發設定">關閉</button></div><div class="muted">編輯後套用到此遊戲預覽；發布仍使用既有確認流程。</div><div class="dock-actions"><button id="devContextEdit">目前頁面設定</button><button id="devAll">全部設定</button><button id="devApply" disabled>套用至遊戲預覽</button><button id="devPublish" disabled>驗證與發布</button></div></div><iframe id="devEditor" class="dev-editor" title="既有平衡資料編輯器" src="/v2-editor"></iframe></aside>
<output id="devStatus" role="status" aria-live="polite"></output>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id),game=$('devGame'),editor=$('devEditor');let activePage='battle',gameReady=false,editorReady=false;
const contexts={battle:['combatMigration','戰鬥與秒數'],statistics:['balanceSettings:rewards','戰鬥獎勵'],roster:['teamSettings','隊伍配置'],partnerRoster:['companions','夥伴'],character:['classes','角色'],skills:['skillSystem','技能'],equipment:['equipment','裝備'],worn:['equipment','裝備與信物'],forge:['balanceSettings:equipment','強化'],bossCraft:['equipmentPower','BOSS 裝備'],shop:['shopSettings','商店'],story:['story','任務／劇情'],quests:['dailyQuests','委託'],gather:['gatheringProducts','採集'],alchemy:['alchemyRecipes','煉金'],lifeSkills:['gatheringProducts','生活'],guide:['uiText','指南與文字']};
function status(text){$('devStatus').textContent=text;}
function route(section){if(editorReady)editor.contentWindow.__EMBERWILD_V2_BRIDGE.open(section);}
function context(){return contexts[activePage]||['overview','遊戲設定'];}
function open(current=true){$('devDock').hidden=false;$('devContext').textContent=context()[1]+' · 開發設定';if(current)route(context()[0]);}
function apply(){if(!editorReady||!gameReady)return;try{const doc=editor.contentWindow.__EMBERWILD_V2_BRIDGE.current();editor.contentWindow.__EMBERWILD_V2_BRIDGE.validate(doc);game.contentWindow.__EMBERWILD_V2_GAME.apply(doc);status('已套用至遊戲預覽。尚未發布至 GitHub。');}catch(e){status('無法套用：'+e.message);}}
$('devOpen').onclick=()=>open();$('devClose').onclick=()=>{$('devDock').hidden=true;};$('devContextEdit').onclick=()=>route(context()[0]);$('devAll').onclick=()=>route('overview');$('devApply').onclick=apply;$('devPublish').onclick=()=>route('releases');
editor.addEventListener('load',()=>{const deadline=Date.now()+30000;const check=()=>{try{if(editor.contentWindow.__EMBERWILD_V2_BRIDGE){editorReady=true;$('devApply').disabled=!gameReady;$('devPublish').disabled=false;$('devOpen').disabled=!gameReady;return;}}catch{}if(Date.now()<deadline)setTimeout(check,50);else status('編輯器尚未完成載入，請重新整理。');};check();});
window.addEventListener('message',event=>{if(event.origin!==location.origin||event.source!==game.contentWindow)return;const m=event.data;if(m?.kind==='dreaming-abyss-dev-ready'){gameReady=true;$('devOpen').disabled=!editorReady;$('devApply').disabled=!editorReady;status('遊戲預覽已就緒。可直接遊玩，或編輯目前畫面的設定。');}if(m?.kind==='dreaming-abyss-dev-page'&&typeof m.page==='string'){activePage=m.page;$('devContext').textContent=context()[1]+' · 開發設定';}});
})();
</script>
</html>
