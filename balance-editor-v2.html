<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>夢淵 · 開發者模式</title>
<style>
:root{color-scheme:dark;font:14px/1.5 "Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;background:var(--bg);color:var(--text);--line:#354348;--gold:#dfc18b;--muted:#adb9ba}*{box-sizing:border-box}body{margin:0;height:100dvh;overflow:hidden}button,input,select,a{font:inherit}button,select{border:1px solid var(--line);background:var(--control);color:inherit;border-radius:7px;padding:7px 11px}button{cursor:pointer}button:hover,select:hover{border-color:var(--gold)}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}button:disabled{opacity:.45;cursor:default}a{color:var(--gold)}button.primary{background:var(--primary);border-color:#8f7953;color:var(--on-primary)}.dev-bar{height:48px;display:flex;align-items:center;gap:12px;padding:6px 16px;border-bottom:1px solid var(--line);background:var(--panel)}.dev-brand{font-weight:700;white-space:nowrap}.dev-brand small{font-size:11px;color:var(--gold);font-weight:500;margin-left:10px;border:1px solid #6e6145;border-radius:4px;padding:3px 6px}.spacer{flex:1}.muted{color:var(--muted);font-size:12px}.dev-workspace{height:calc(100dvh - 48px);display:flex;min-width:0}.dev-game{display:block;flex:1;min-width:0;border:0;height:100%;background:var(--bg)}.dev-dock{width:clamp(440px,40vw,620px);flex-shrink:0;min-width:0;background:var(--panel);border-left:1px solid #625a46;display:flex;flex-direction:column}.dev-dock[hidden]{display:none}.dock-head{padding:14px 16px 10px;border-bottom:1px solid var(--line)}.dock-title{display:flex;align-items:center;justify-content:space-between;gap:10px}.dock-title h1{font-size:17px;margin:0}.dock-kicker{font-size:10px;letter-spacing:.12em;color:var(--gold);margin-bottom:3px}.dock-title button{font-size:12px}.dock-context{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:10px 0;font-size:12px;color:var(--muted)}.dock-context label{display:flex;align-items:center;gap:5px;white-space:nowrap}.dock-context input{accent-color:var(--gold)}.context-tabs{display:flex;gap:6px;flex-wrap:wrap}.context-tabs button{font-size:12px;padding:6px 9px;background:transparent}.context-tabs button[aria-pressed=true]{border-color:var(--gold);background:var(--selected);color:var(--text)}.all-settings{display:flex;gap:8px;align-items:center;margin-top:10px}.all-settings select{width:100%;min-width:0;font-size:12px}.all-settings[hidden]{display:none}.dev-editor{flex:1;min-height:0;border:0;width:100%;background:var(--panel)}.dock-foot{border-top:1px solid var(--line);padding:12px 16px;background:var(--chrome)}.draft-state{font-size:12px;margin-bottom:8px;color:var(--muted)}.draft-state.pending{color:var(--gold)}.dock-actions{display:flex;gap:7px;flex-wrap:wrap}.dock-actions button{font-size:12px}.dock-actions .primary{flex:1}#devStatus{position:fixed;left:16px;bottom:12px;max-width:min(600px,calc(100vw - 32px));padding:8px 12px;border:1px solid #695d42;border-radius:6px;background:var(--chrome);z-index:20;white-space:pre-wrap;font-size:12px}#devStatus:empty{display:none}.audit-link{font-size:12px}.preview-note{font-size:11px;color:var(--muted);margin-top:8px}.dock-foot a{font-size:11px}.dev-bar .primary{font-size:12px}
@media(max-width:1100px){.dev-dock{position:fixed;right:0;top:48px;bottom:0;width:min(600px,85vw);z-index:10;box-shadow:-18px 0 50px #0009}.dev-bar>.muted{display:none}}
@media(max-width:600px){.dev-bar{gap:6px;padding:6px 10px}.dev-brand small{margin-left:5px;font-size:10px}.audit-link{display:none}.dev-dock{width:100%;border-left:0}.dock-head{padding:12px}.dock-foot{padding:10px 12px}.dock-title h1{font-size:16px}.dev-bar button{padding:6px 8px}#devStatus{bottom:8px;left:8px;max-width:calc(100vw - 16px)}}.sim-panel{flex:1;min-height:0;overflow:auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px}.sim-panel[hidden]{display:none}.sim-tabs{display:flex;gap:6px;flex-wrap:wrap}.sim-tabs button{font-size:12px;background:transparent}.sim-tabs button[aria-pressed=true]{border-color:var(--gold);background:var(--selected)}.sim-form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.sim-form label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);min-width:0}.sim-form select,.sim-form input{width:100%;min-width:0;border:1px solid var(--line);background:var(--control);color:var(--text);border-radius:7px;padding:6px 8px}.sim-form .wide{grid-column:1/-1}.sim-compare{font-size:12px;display:flex;gap:6px;align-items:center}.sim-run{display:flex;gap:10px;align-items:center}.sim-run progress{flex:1}.sim-result{font-size:12px;overflow-wrap:anywhere}.sim-result table{width:100%;border-collapse:collapse;margin:6px 0 12px}.sim-result th,.sim-result td{border-bottom:1px solid var(--line);padding:4px 6px;text-align:left}.sim-result th{color:var(--gold);font-weight:600}.sim-result .up{color:#8fd19e}.sim-result .down{color:#e49a8a}.sim-result h3{font-size:13px;margin:10px 0 4px}.sim-error{color:#e49a8a}@media(max-width:400px){.sim-form{grid-template-columns:1fr}}
</style>
<link rel="stylesheet" href="/v2-theme.css">
<header class="dev-bar"><span class="dev-brand">夢淵<small>開發者模式</small></span><span class="muted">點選遊戲頁面或物件，直接編輯使用中的資料</span><span class="spacer"></span><a class="audit-link" href="/v2-audit" target="_blank" rel="noopener">資料稽核</a><button id="devPlay" disabled>遊玩測試</button><button id="devOpen" class="primary" disabled aria-controls="devDock" aria-expanded="false">編輯目前畫面</button></header>
<div class="dev-workspace"><iframe id="devGame" class="dev-game" title="夢淵遊戲預覽" src="/v2-game/"></iframe>
<aside id="devDock" class="dev-dock" hidden aria-label="開發設定"><div class="dock-head"><div class="dock-title"><div><div class="dock-kicker">DEVELOPER SETTINGS</div><h1 id="devContext">開發設定</h1></div><button id="devClose" aria-label="關閉開發設定">收起</button></div><div class="dock-context"><span id="devPage">目前畫面：荒野探索</span><label><input id="devFollow" type="checkbox" checked>跟隨遊戲畫面</label></div><nav id="devTabs" class="context-tabs" aria-label="目前畫面設定"></nav><div class="all-settings" id="devSettingsRow" hidden><label for="devSettings" class="muted">設定</label><select id="devSettings" aria-label="所有開發設定"></select></div></div>
<section id="devSimPanel" class="sim-panel" hidden aria-label="模擬試算"><div class="sim-tabs" id="simTabs"><button data-sim="level" aria-pressed="true">升級速度</button><button data-sim="skill" aria-pressed="false">技能試打</button><button data-sim="equipment" aria-pressed="false">裝備數值</button></div><p class="muted" id="simHelp"></p><div id="simForm" class="sim-form"></div><label class="sim-compare"><input id="simCompare" type="checkbox" checked>同時用遊戲內建資料跑一次做比較</label><div class="sim-run"><button id="simRun" class="primary">開始試算</button><progress id="simProgress" max="1" value="0" hidden></progress></div><div id="simResult" class="sim-result" role="status" aria-live="polite"></div></section>
<iframe id="devEditor" class="dev-editor" title="平衡資料編輯面板" src="/v2-editor"></iframe>
<footer class="dock-foot"><div id="devDraftState" class="draft-state pending" role="status">工作草稿尚未套用至預覽</div><div class="dock-actions"><button id="devAll" disabled>全部設定</button><button id="devSim" disabled aria-controls="devSimPanel" aria-pressed="false">模擬試算</button><button id="devSave" disabled>儲存草稿</button><button id="devApply" class="primary" disabled>套用至遊戲預覽</button><button id="devPublish" disabled>驗證與發布</button></div><div class="preview-note">套用只更新此預覽；<a href="/workbench" target="_blank" rel="noopener">完整工作台</a> · <span>重整後清除測試進度</span></div></footer></aside></div>
<output id="devStatus" role="status" aria-live="polite"></output>
<script src="/scripts/v2-page-context.js"></script>
<script src="/scripts/v2-simulation.js"></script>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id),game=$('devGame'),editor=$('devEditor');let activePage='battle',gameReady=false,editorReady=false,revision=0,appliedRevision=-1,section='',toastTimer,gameContext={},editing=true;
const contexts=Object.fromEntries(Object.entries(DreamingAbyssPageContexts).map(([id,c])=>[id,[c.label,c.sections.map(x=>[x.id,x.label,x.paths])]]));
const bridge=()=>editor.contentWindow.__EMBERWILD_V2_BRIDGE;
function context(){return contexts[activePage]||['遊戲設定',[['overview','總覽']]];}
function status(text){clearTimeout(toastTimer);$('devStatus').textContent=text;toastTimer=setTimeout(()=>{$('devStatus').textContent='';},6500);}
function draft(){const pending=revision!==appliedRevision;$('devDraftState').textContent=pending?'工作草稿尚未套用至預覽':'目前草稿已套用至預覽 · 尚未發布';$('devDraftState').classList.toggle('pending',pending);}
function sections(){return editorReady?bridge().sections():[];}
function tabs(){const available=new Set(sections().flatMap(g=>g.pages.map(p=>p.id)));$('devTabs').replaceChildren();for(const [id,title,paths] of context()[1]){if(!available.has(id))continue;const b=document.createElement('button');b.textContent=title;b.title=(paths||[]).join('、');b.dataset.section=id;b.setAttribute('aria-pressed',String(section===id));b.onclick=()=>route(id);$('devTabs').append(b);}$('devPage').textContent='目前畫面：'+context()[0];}
function title(){const row=sections().flatMap(g=>g.pages).find(p=>p.id===section);$('devContext').textContent=(row?.label||context()[0])+' · 開發設定';}
function route(id){if(!editorReady)return;DreamingAbyssSimulation.hide();try{const actual=bridge().open(id,gameContext);if(actual===false)return;section=actual;title();tabs();$('devSettings').value=section;}catch(e){status('無法開啟設定：'+e.message);}}
function current(){const available=new Set(sections().flatMap(g=>g.pages.map(p=>p.id)));return context()[1].find(([id])=>available.has(id))?.[0]||'overview';}
function open(currentPage=true){$('devDock').hidden=false;$('devOpen').setAttribute('aria-expanded','true');if(currentPage){$('devFollow').checked=true;$('devSettingsRow').hidden=true;route(current());}else{title();tabs();}}
function close(){$('devDock').hidden=true;$('devOpen').setAttribute('aria-expanded','false');$('devOpen').focus();}
function apply(){if(!editorReady||!gameReady)return;try{const doc=bridge().current();bridge().validate(doc);game.contentWindow.__EMBERWILD_V2_GAME.apply(doc);appliedRevision=revision;draft();status('已套用至遊戲預覽。尚未發布至 GitHub。');}catch(e){status('無法套用：'+e.message);}}
$('devPlay').onclick=()=>{editing=!editing;$('devPlay').textContent=editing?'遊玩測試':'返回資料編輯';game.contentWindow.__EMBERWILD_V2_GAME.inspect(editing);if(editing)open();else close();};$('devOpen').onclick=()=>open();$('devClose').onclick=close;$('devAll').onclick=()=>{$('devFollow').checked=false;$('devSettingsRow').hidden=false;$('devSettings').focus();};$('devSettings').onchange=()=>route($('devSettings').value);$('devFollow').onchange=()=>{if($('devFollow').checked){$('devSettingsRow').hidden=true;route(current());}};$('devApply').onclick=apply;$('devSim').onclick=()=>DreamingAbyssSimulation.toggle();$('devSave').onclick=()=>{try{bridge().save();status('已儲存目前工作草稿。');}catch(e){status('無法儲存：'+e.message);}};$('devPublish').onclick=()=>{$('devFollow').checked=false;route('releases');};
function editorInit(){const deadline=Date.now()+30000;const check=()=>{try{if(bridge()){editorReady=true;bridge().theme(document.documentElement.dataset.uiTheme||'ember');for(const id of ['devAll','devSave','devPublish'])$(id).disabled=false;DreamingAbyssSimulation.enable(bridge);$('devApply').disabled=!gameReady;$('devOpen').disabled=false;$('devSettings').replaceChildren();for(const group of sections()){const g=document.createElement('optgroup');g.label=group.label;for(const page of group.pages){const o=document.createElement('option');o.value=page.id;o.textContent=page.label;g.append(o);}$('devSettings').append(g);}revision++;draft();tabs();if(gameReady&&editing)open();return;}}catch{}if(Date.now()<deadline)setTimeout(check,50);else status('編輯器尚未完成載入，請重新整理。');};check();}
editor.addEventListener('load',editorInit);if(editor.contentDocument?.readyState==='complete')editorInit();
window.addEventListener('message',event=>{if(event.origin!==location.origin)return;const m=event.data;if(event.source===editor.contentWindow){if(m?.kind==='dreaming-abyss-dev-change'){revision++;draft();}if(m?.kind==='dreaming-abyss-dev-section'&&typeof m.section==='string'){section=m.section;title();tabs();$('devSettings').value=section;}return;}if(event.source!==game.contentWindow)return;if(m?.kind==='dreaming-abyss-dev-theme'&&['ember','forest','paper'].includes(m.theme)){document.documentElement.dataset.uiTheme=m.theme;if(editorReady)bridge().theme(m.theme);return;}if(m?.kind==='dreaming-abyss-dev-ready'){gameReady=true;$('devPlay').disabled=false;$('devOpen').disabled=!editorReady;$('devApply').disabled=!editorReady;if(editorReady&&editing)open();status('資料編輯已就緒。切換遊戲頁面即可編輯該頁資料；點選技能或物品可定位定義。');}if(m?.kind==='dreaming-abyss-dev-inspect'&&editing&&editorReady){try{gameContext={...gameContext,...m.context};open(false);section=bridge().inspect(m.target,gameContext);title();tabs();status('已定位到遊戲物件使用的平衡資料。');}catch(e){status('無法定位資料：'+e.message);}return;}if(m?.kind==='dreaming-abyss-dev-page'&&typeof m.page==='string'){const changed=activePage!==m.page;activePage=m.page;gameContext={mapIndex:m.mapIndex,job:m.job};tabs();if(editing&&editorReady&&$('devFollow').checked&&(changed||m.navigated))open();}});
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('devDock').hidden)close();});
})();
</script>
</html>
