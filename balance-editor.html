<!DOCTYPE html>

<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1" name="viewport"/>
<title>Emberwild 平衡工作台</title>
<style>
:root{
  --bg:#111418;--panel:#181d23;--panel2:#20262e;--line:#323a45;
  --text:#edf1f5;--muted:#9da7b4;--accent:#78a9ff;--danger:#ff7b72;
  --ok:#73d13d;--warn:#f6c85f;--input:#101419;--shadow:0 12px 30px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;font-size:14px}
button,input,select,textarea{font:inherit}
button{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:8px;padding:8px 11px;cursor:pointer}
button:hover{border-color:#566172}
button.primary{background:#245ca8;border-color:#3573c8}
button.danger{color:#ffd7d4;border-color:#7b3f3b}
button.ghost{background:transparent}
button.small{padding:5px 8px;font-size:12px}
input,select,textarea{width:100%;background:var(--input);color:var(--text);border:1px solid var(--line);border-radius:7px;padding:8px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px rgba(120,169,255,.12)}
textarea{min-height:80px;resize:vertical}
label{display:block;color:var(--muted);font-size:12px;margin-bottom:5px}
.topbar{height:58px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 14px;position:sticky;top:0;background:rgba(17,20,24,.97);z-index:20}
.brand{font-weight:700;font-size:16px;margin-right:6px}
.status{font-size:12px;color:var(--muted);margin-right:auto}
.layout{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:calc(100vh - 58px)}
.sidebar{border-right:1px solid var(--line);padding:12px;position:sticky;top:58px;height:calc(100vh - 58px);overflow:auto}
.navbtn{display:flex;width:100%;align-items:center;justify-content:space-between;background:transparent;border-color:transparent;text-align:left;margin:2px 0}
.navbtn.active{background:var(--panel2);border-color:var(--line)}
.badge{font-size:11px;color:var(--muted);padding:2px 6px;border:1px solid var(--line);border-radius:999px}
.main{padding:18px;min-width:0}
.section-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:16px}
.section-head h1{font-size:20px;margin:0 0 4px}
.section-head p{margin:0;color:var(--muted);font-size:13px}
.section-actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.grid2{display:grid;grid-template-columns:minmax(260px,360px) minmax(0,1fr);gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;gap:8px;padding:11px 12px;border-bottom:1px solid var(--line)}
.card-h strong{margin-right:auto}
.card-b{padding:12px}
.list{max-height:calc(100vh - 180px);overflow:auto}
.listitem{padding:10px;border-bottom:1px solid #272e37;cursor:pointer}
.listitem:hover{background:#1d232b}
.listitem.active{background:#253143}
.listitem .title{font-weight:650}
.listitem .sub{font-size:12px;color:var(--muted);margin-top:3px}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
.field.full{grid-column:1/-1}
.field label{color:#d4dbe4;font-size:13px;margin-bottom:4px}
.field-key{display:block;color:#738091;font-size:10px;font-family:"Cascadia Code","Consolas",monospace;margin-top:2px;font-weight:400}
.field-help{color:var(--muted);font-size:11px;line-height:1.5;margin:5px 1px 0}
.ref-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.ref-item{border:1px solid var(--line);background:#151a20;border-radius:8px;padding:10px}
.ref-item b{display:block;margin-bottom:4px}
.ref-item code{font-size:11px;color:#9fb0c3}
.ref-item p{font-size:12px;color:var(--muted);line-height:1.55;margin:5px 0 0}
.readonly-tag{font-size:10px;padding:2px 5px;border:1px solid var(--line);border-radius:4px;color:var(--muted);margin-left:5px}
.pathrow{grid-template-columns:minmax(300px,1.2fr) minmax(180px,.7fr)!important}
.pathrow .path strong{display:block;color:var(--text);font-family:Inter,"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;font-size:13px;margin-bottom:2px}
.pathrow .path small{display:block;color:var(--muted);font-family:Inter,"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;line-height:1.45;margin-top:3px}
.pathrow .path code{font-size:10px;color:#718094}
@media(max-width:900px){.ref-grid{grid-template-columns:1fr}.pathrow{grid-template-columns:1fr!important}}
.inline{display:flex;gap:8px;align-items:center}
.inline > *{min-width:0}
.pill{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;padding:3px 7px;font-size:11px;color:var(--muted)}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.toolbar select,.toolbar input{width:auto;min-width:150px}
.empty{padding:26px;text-align:center;color:var(--muted)}
.hr{height:1px;background:var(--line);margin:14px 0}
.kvrow{display:grid;grid-template-columns:minmax(130px,.65fr) minmax(140px,1fr) 100px 34px;gap:7px;align-items:center;margin-bottom:7px}
.kvrow input,.kvrow select{padding:6px 7px}
.mini-note{color:var(--muted);font-size:12px;line-height:1.55}
.notice{padding:10px 12px;border:1px solid #5b4a22;background:#2c2617;border-radius:8px;color:#ead49b;font-size:12px;margin-bottom:12px}
.oknotice{padding:10px 12px;border:1px solid #365b30;background:#182617;border-radius:8px;color:#b9e7a4;font-size:12px;margin-bottom:12px}
.errornotice{padding:10px 12px;border:1px solid #6d3535;background:#2a1717;border-radius:8px;color:#ffc3bf;font-size:12px;margin-bottom:12px}
.code{font-family:"Cascadia Code","Consolas",monospace}
#rawEditor{min-height:65vh;font-family:"Cascadia Code","Consolas",monospace;font-size:12px;line-height:1.5;tab-size:2}
.statgrid{display:grid;grid-template-columns:repeat(4,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.stat{padding:13px}.stat .n{font-size:24px;font-weight:700}.stat .l{font-size:12px;color:var(--muted)}
.balance-tree details{border:1px solid var(--line);border-radius:8px;margin:7px 0;background:#151a20}
.balance-tree summary{cursor:pointer;padding:9px 11px;font-weight:650}
.balance-tree .inside{padding:0 10px 10px}
.pathrow{display:grid;grid-template-columns:minmax(220px,1fr) minmax(180px,.7fr) 34px;gap:8px;align-items:center;margin:7px 0}
.pathrow .path{font-family:"Cascadia Code","Consolas",monospace;font-size:12px;color:#b9c4d2;overflow-wrap:anywhere}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.hidden{display:none!important}
.footer-note{color:var(--muted);font-size:11px;margin-top:12px}
.unsaved::before{content:"● ";color:var(--warn)}
.saved::before{content:"● ";color:var(--ok)}
@media(max-width:900px){
  .layout{grid-template-columns:1fr}
  .sidebar{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);display:flex;gap:4px;overflow:auto;white-space:nowrap}
  .navbtn{width:auto}
  .grid2{grid-template-columns:1fr}
  .list{max-height:260px}
  .fields{grid-template-columns:1fr}
  .field.full{grid-column:auto}
  .statgrid{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>
<div class="topbar workspace-topbar">
<div class="brand">Emberwild 平衡工作台</div>
<div class="workspace-meta"><span class="workspace-chip" id="editorVersionChip">Editor 2.0</span><span class="workspace-chip" id="workspaceRevisionChip">本機版次 0</span><span class="workspace-chip" id="workspaceTimeChip">尚未自動儲存</span></div>
<div class="status saved" id="status">正在載入工作資料</div>
<input accept=".json,application/json" hidden="" id="fileInput" type="file"/>
<button id="importBtn">開啟平衡 JSON</button>
<button id="cacheBtn">立即儲存</button>
<button id="restoreBtn">載入本機草稿</button>
<button class="primary" id="exportBtn">匯出測試 JSON</button>
<button id="releaseBtn">匯出正式 JSON</button>
</div>
<div class="layout">
<aside class="sidebar" id="nav"></aside>
<main class="main" id="app"></main>
</div>

function deepFillDefaults(def,src){
  if(Array.isArray(def))return def.map((v,i)=>deepFillDefaults(v,Array.isArray(src)?src[i]:undefined));

  return src===undefined?def:src;
}
function flattenSettingLeaves(v,path="",out=[]){

}

function esc(v){
  return String(v ?? "").replace(/[&<>"']/g,s=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[s]));
}
function markDirty(msg="尚未匯出"){
  dirty=true;
  const el=document.getElementById("status");
  el.className="status unsaved"; el.textContent=msg;
  renderNav();
}
function markSaved(msg="已匯出"){
  dirty=false;
  const el=document.getElementById("status");
  el.className="status saved"; el.textContent=msg;
}
function ensureArrays(){
  data.balanceSettings=deepFillDefaults(BALANCE_SETTINGS_DEFAULTS,data.balanceSettings);
  if(!Array.isArray(data.classes)) data.classes=[];
  if(!Array.isArray(data.supportSkills)) data.supportSkills=[];
  if(!Array.isArray(data.equipmentForms)) data.equipmentForms=[];
  if(!Array.isArray(data.items)) data.items=[];
  while(data.supportSkills.length < data.classes.length) data.supportSkills.push([]);
  while(data.equipmentForms.length < data.classes.length) data.equipmentForms.push([[],[],[]]);
  data.equipmentForms = data.equipmentForms.map(x => {
    if(!Array.isArray(x)) x=[];
    while(x.length<3) x.push([]);
    return x;
  });
}
function count(section){
  ensureArrays();
  if(section==="classes") return data.classes.length;
  if(section==="skills") return data.classes.reduce((n,c)=>n+(Array.isArray(c.skills)?c.skills.length:0),0);
  if(section==="support") return data.supportSkills.reduce((n,a)=>n+(Array.isArray(a)?a.length:0),0);
  if(section==="equipment") return data.equipmentForms.reduce((n,c)=>n+c.reduce((m,s)=>m+(Array.isArray(s)?s.length:0),0),0);
  if(section==="items") return data.items.length;
  if(section==="balanceSettings") return flattenSettingLeaves(data.balanceSettings).length;
  return "";
}
function renderNav(){
  const nav=document.getElementById("nav");

    <button class="navbtn ${currentSection===id?"active":""}" data-sec="${id}">
      <span>${label}</span>${count(id)!==""?`<span class="badge">${count(id)}</span>`:""}
    </button>`).join("");
  nav.querySelectorAll("[data-sec]").forEach(b=>b.onclick=()=>{currentSection=b.dataset.sec; render();});
}

}

function bindObjectFields(container,obj){
  container.querySelectorAll("[data-key]").forEach(el=>{
    el.onchange=()=>{
      const k=el.dataset.key;
      if(el.dataset.json==="1"){
        try{obj[k]=JSON.parse(el.value); el.style.borderColor=""; markDirty();}catch{el.style.borderColor="var(--danger)";}
        return;
      }
      if(el.type==="number") obj[k]=el.value===""?0:Number(el.value);
      else if(el.dataset.bool==="1" || (el.tagName==="SELECT" && (el.value==="true"||el.value==="false"))) obj[k]=el.value==="true";
      else obj[k]=el.value;
      markDirty();
      renderNav();
    };
  });
}

function renderExclusiveRows(e){
  const host=document.getElementById("exclusiveRows");
  host.innerHTML=Object.entries(e.exclusive).map(([k,v],i)=>`<div class="kvrow" data-row="${i}">
    <select class="ex-key">${[...new Set([...EXCLUSIVE_KEYS,k])].map(x=>`<option value="${esc(x)}" ${x===k?"selected":""}>${esc(EXCLUSIVE_LABELS[x]||x)}</option>`).join("")}</select>
    <input class="ex-val" type="number" min="-100" max="500" step="0.01" value="${esc(v)}">
    <span class="pill">%</span><button class="small danger ex-del">×</button>
    <div class="field-help" style="grid-column:1/-1">${esc(EXCLUSIVE_HELP[k]||"")} <span class="field-key">JSON：${esc(k)}</span></div>
  </div>`).join("") || `<div class="mini-note" style="margin-bottom:8px">尚無專屬固定屬性。</div>`;
  [...host.querySelectorAll(".kvrow")].forEach((row,i)=>{
    const oldKey=Object.keys(e.exclusive)[i], keySel=row.querySelector(".ex-key"), val=row.querySelector(".ex-val");
    keySel.onchange=()=>{
      const newKey=keySel.value;
      if(newKey!==oldKey && newKey in e.exclusive){alert("這個屬性已存在。");keySel.value=oldKey;return;}
      const value=e.exclusive[oldKey]; delete e.exclusive[oldKey]; e.exclusive[newKey]=value; markDirty();renderEquipment();
    };
    val.onchange=()=>{e.exclusive[oldKey]=Number(val.value);markDirty();};
    row.querySelector(".ex-del").onclick=()=>{delete e.exclusive[oldKey];markDirty();renderEquipment();};
  });
}

function inferType(v){
  if(Array.isArray(v)|| (v && typeof v==="object")) return "json";
  if(typeof v==="number")return "number";
  if(typeof v==="boolean")return "boolean";
  if(v===null)return "null";
  return "string";
}

  }).join("") || `<div class="mini-note">這個物件目前沒有欄位。</div>`;
  [...host.querySelectorAll("[data-grow]")].forEach((row,i)=>{

      }catch(e){alert("JSON 格式錯誤："+e.message)}
    };
    typeSel.onchange=()=>{

  });
  document.getElementById("addGenericField").onclick=()=>{
    let i=1,k="newField";while(k in obj)k="newField"+(++i);obj[k]="";markDirty();render();
  };

function flattenLeaves(obj,prefix="",out=[]){
  if(obj && typeof obj==="object" && !Array.isArray(obj)){
    for(const [k,v] of Object.entries(obj)){
      const p=prefix?prefix+"."+k:k;
      if(v && typeof v==="object" && !Array.isArray(v)) flattenLeaves(v,p,out);
      else out.push([p,v]);
    }
  }
  return out;
}
function getByPath(obj,path){return path.split(".").reduce((a,k)=>a?.[k],obj);}
function setByPath(obj,path,val){
  const parts=path.split("."), last=parts.pop(); let cur=obj; for(const p of parts)cur=cur[p];cur[last]=val;
}
function deleteByPath(obj,path){
  const parts=path.split("."), last=parts.pop(); let cur=obj;for(const p of parts)cur=cur[p];delete cur[last];
}

function validateData(){
  const issues=[]; ensureArrays();
  if(data.schema!=="emberwild-balance-v1")issues.push("schema 必須是 emberwild-balance-v1，否則遊戲直接拒絕匯入。");
  if(data.classes.length!==EXPECTED_CLASS_COUNT)issues.push(`目前 HTML 固定要求 ${EXPECTED_CLASS_COUNT} 個角色，現在是 ${data.classes.length} 個。`);
  if(data.equipmentForms.length!==EXPECTED_CLASS_COUNT)issues.push(`equipmentForms 必須有 ${EXPECTED_CLASS_COUNT} 個職業群組。`);
  if(data.supportSkills.length!==EXPECTED_CLASS_COUNT)issues.push(`supportSkills 建議維持 ${EXPECTED_CLASS_COUNT} 個職業群組；少或多都可能使輔助技能不同步。`);
  data.classes.forEach((c,ci)=>{
    if(!Number.isFinite(c?.hp)||c.hp<=0)issues.push(`角色 ${ci} 基礎生命必須大於 0。`);
    if(!Number.isFinite(c?.atk)||c.atk<=0)issues.push(`角色 ${ci} 基礎攻擊必須大於 0。`);
    if(!Number.isFinite(c?.def)||c.def<0)issues.push(`角色 ${ci} 基礎防禦不可小於 0。`);
    if(!Array.isArray(c?.skills)||!c.skills.length)issues.push(`角色 ${ci} 至少要有 1 個核心技能。`);
    (c?.skills||[]).forEach((sk,si)=>{
      if(!ACTIVATIONS.includes(sk.activation)||!EFFECTS.includes(sk.effect)||!ELEMENTS.includes(sk.element))issues.push(`角色 ${ci} 技能 ${si} 的發動方式／效果／屬性不在遊戲允許範圍。`);
      if(!Number.isInteger(sk.requiredLevel)||sk.requiredLevel<1)issues.push(`角色 ${ci} 技能 ${si} 的需求等級必須是至少 1 的整數。`);
      if(!Number.isFinite(sk.cooldown)||sk.cooldown<0||!Number.isFinite(sk.power)||sk.power<0||!Number.isFinite(sk.maxTargets)||sk.maxTargets<1)issues.push(`角色 ${ci} 技能 ${si} 的冷卻、倍率或目標數無效。`);
    });
  });
  data.supportSkills.forEach((g,ci)=>{if(!Array.isArray(g)||g.length!==EXPECTED_SUPPORT_PER_CLASS)issues.push(`角色 ${ci} 應維持 ${EXPECTED_SUPPORT_PER_CLASS} 個輔助技能；遊戲存檔 supportLevels 固定長度為 3。`);});
  data.equipmentForms.forEach((jobs,job)=>{
    if(!Array.isArray(jobs)||jobs.length!==3){issues.push(`角色 ${job} 的裝備必須固定 3 個部位群組。`);return;}
    jobs.forEach((forms,slot)=>{if(!Array.isArray(forms)||forms.length<1)issues.push(`角色 ${job} 的「${SLOT_NAMES[slot]}」至少要有 1 種裝備變體。`);(forms||[]).forEach((f,i)=>{if(f.element!==undefined&&f.element!==""&&!ELEMENTS.includes(f.element))issues.push(`裝備 ${job}-${slot}-${i} 的元素無效。`);if(f.exclusive)for(const [k,v] of Object.entries(f.exclusive))if(!EXCLUSIVE_KEYS.includes(k)||!Number.isFinite(v)||v<-100||v>500)issues.push(`裝備 ${job}-${slot}-${i} 的專屬屬性 ${k} 無效或超出 -100~500。`);});});
  });
  if(data.items.length!==EXPECTED_ITEM_COUNT)issues.push(`商店道具必須固定 ${EXPECTED_ITEM_COUNT} 筆；目前是 ${data.items.length} 筆。`);
  const originalItems=ORIGINAL_DATA.items||[];
  data.items.forEach((x,i)=>{const base=originalItems.find(v=>v.id===x.id);if(!base)issues.push(`道具 ${i} 的 id「${x.id}」不是 HTML 內建固定道具。`);else if(x.type!==base.type||x.element!==base.element)issues.push(`道具 ${x.id} 的 type / element 不可改，否則遊戲匯入失敗。`);if(!Number.isFinite(x.cost)||x.cost<0||!Number.isInteger(x.duration)||x.duration<0)issues.push(`道具 ${x.id} 的價格必須非負，持續回合必須是非負整數。`);});
  const bs=data.balanceSettings;
  if(!bs||typeof bs!=="object")issues.push("缺少 balanceSettings；修改版遊戲會使用內建預設值，但建議由本編輯器補齊後再匯出。");
  else{
    const probabilityPaths=["equipment.lootOwnerSameJobChance","equipment.difficultyAffix.hardChance","equipment.difficultyAffix.hellChance","equipment.difficultyAffix.skillChance","monsters.encounter.bossChance","monsters.encounter.eliteChance","rewards.equipmentQuality.rareChance","rewards.equipmentQuality.fineConditionalChance","rewards.potionDropChance","rewards.postVictoryHeal","rewards.radiant.normalElite","rewards.radiant.bossFinal","combat.autoPotionThreshold","combat.defeatGoldLoss","combat.supply.wardResistance","combat.supply.elementTonicDamage"];
    for(const p of probabilityPaths){const v=getByPath(bs,p);if(!Number.isFinite(v)||v<0||v>1)issues.push(`平衡設定 ${p} 必須是 0~1。`);}
    const ec=bs.monsters?.encounter;if(ec&&ec.bossChance+ec.eliteChance>1)issues.push("BOSS 遭遇率＋菁英遭遇率不可超過 1。");
    if(bs.equipment?.enhance?.maxLevel<0||!Number.isInteger(bs.equipment?.enhance?.maxLevel))issues.push("強化最高等級必須是非負整數。");
    if(bs.combat?.groupSize?.min<1||bs.combat?.groupSize?.max<bs.combat?.groupSize?.min)issues.push("遭遇怪物數量的最小／最大值無效。");
    (bs.maps?.levelRanges||[]).forEach((m,i)=>{if(!Number.isFinite(m.min)||!Number.isFinite(m.max)||m.min<1||m.max<m.min)issues.push(`${MAP_NAMES[i]||'地圖 '+(i+1)} 的等級範圍無效。`);});
  }
  const qc=data.balance?.affixes?.qualityChance;
  if(qc && typeof qc==="object"){
    const vals=Object.values(qc).map(Number),sum=vals.reduce((a,b)=>a+(Number(b)||0),0);
    if(vals.some(v=>v<0||v>1)||Math.abs(sum-1)>1e-9)issues.push(`詞條品質機率四項必須介於 0~1 且合計 1；目前合計 ${sum}。`);
  }
  for(const k of ["skillSpecialChance","skillEffectShare","extendedPoolChance"]){const v=data.balance?.affixes?.[k];if(Number.isFinite(v)&&(v<0||v>1))issues.push(`${k} 必須介於 0~1。`);}
  const caps=data.balance?.combat?.statCaps||{};for(const [k,v] of Object.entries(caps))if(!Number.isFinite(v)||v<0||v>1)issues.push(`最終上限 ${k} 必須介於 0~1。`);
  return issues;
}

function downloadText(filename,text,type){
  const blob=new Blob([text],{type}); const url=URL.createObjectURL(blob);
  const a=document.createElement("a");a.href=url;a.download=filename;a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
document.getElementById("importBtn").onclick=()=>document.getElementById("fileInput").click();
document.getElementById("fileInput").onchange=async(e)=>{
  const file=e.target.files[0]; if(!file)return;
  try{
    const parsed=JSON.parse(await file.text()); data=parsed;ensureArrays();
    selected={class:0,skillClass:0,skill:0,supportClass:0,support:0,equipClass:0,equipSlot:0,equip:0,item:0,generic:{monsters:0,drops:0,enhancement:0}};
    markDirty(`已匯入 ${file.name}，尚未匯出`);render();
  }catch(err){alert("JSON 格式錯誤："+err.message)}
  e.target.value="";
};
document.getElementById("exportBtn").onclick=()=>{
  const issues=validateData();
  if(issues.length && !confirm(`目前有 ${issues.length} 個資料提醒。仍要匯出嗎？\n\n`+issues.slice(0,8).join("\n")))return;
  downloadText("emberwild-balance-settings.json",JSON.stringify(data,null,2),"application/json;charset=utf-8");
  markSaved("已匯出 emberwild-balance-settings.json");
};
document.getElementById("cacheBtn").onclick=()=>{

document.getElementById("restoreBtn").onclick=()=>{

  if(!s){alert("目前沒有瀏覽器草稿。");return;}
  try{data=JSON.parse(s);ensureArrays();markDirty("已還原瀏覽器草稿，尚未匯出");render();}catch(e){alert("草稿損壞："+e.message)}
};
window.addEventListener("beforeunload",e=>{if(dirty){e.preventDefault();e.returnValue="";}});
render();
</script>

// Dynamic arrays must preserve user-added enemy skills instead of truncating to the default length.
deepFillDefaults=function deepFillDefaultsActionTurns(def,src,path=''){
  if(Array.isArray(def)){
    if(path==='monsters.skills'){
      if(!Array.isArray(src))return structuredClone(def);
      if(!def.length)return structuredClone(src);
      const template=def[0];
      return src.map((v,i)=>deepFillDefaultsActionTurns(def[i]===undefined?template:def[i],v,path+'.'+i));
    }
    return def.map((v,i)=>deepFillDefaultsActionTurns(v,Array.isArray(src)?src[i]:undefined,path?path+'.'+i:String(i)));
  }
  if(def&&typeof def==='object'){const out=src&&typeof src==='object'&&!Array.isArray(src)?structuredClone(src):{};for(const [k,v] of Object.entries(def)){const next=path?path+'.'+k:k;out[k]=deepFillDefaultsActionTurns(v,src&&typeof src==='object'?src[k]:undefined,next);}return out;}
  return src===undefined?def:src;
};

const actionTurnEnsureArraysBase=ensureArrays;
ensureArrays=function(){
  actionTurnEnsureArraysBase();
  data.balance??={};data.balance.affixes??={};data.balance.affixes.extendedValues??={};
  data.balance.affixes.extendedValues.allCooldownReduction=deepFillDefaults({normal:0,fine:0,rare:1,legendary:2},data.balance.affixes.extendedValues.allCooldownReduction);
  data.balanceSettings=deepFillDefaults(BALANCE_SETTINGS_DEFAULTS,data.balanceSettings);
};

const actionTurnSettingMetaBase=settingMeta;
settingMeta=function(path){
  const p=path.replace(/^balanceSettings\./,'');
  let m=p.match(/^monsters\.skillSystem\.assignChance\.(normal|elite|boss|final)$/);
  if(m){const n={normal:'普通怪',elite:'菁英怪',boss:'地圖 BOSS',final:'終局 BOSS'}[m[1]];return {label:`${n}獲得隨機技能機率`,help:'0~1 小數。生成敵人時先判定是否配置一項符合條件的技能；配置後技能冷卻只在該敵人自身行動時推進。'};}
  if(p==='skills.gems.cooldownReduction')return {label:'疾風石主動冷卻減少',help:'主動技能減少的角色自身行動回合；不會因其他單位行動或戰鬥倍速額外推進。'};
  return actionTurnSettingMetaBase(path);
};
const actionTurnBalanceMetaBase=balanceMeta;
balanceMeta=function(path){
  let m=path.match(/^balance\.affixes\.extendedValues\.allCooldownReduction\.(normal|fine|rare|legendary)$/);
  if(m){const q={normal:'普通',fine:'精良',rare:'稀有',legendary:'傳說'};return {label:`${q[m[1]]}全技能冷卻減少`,help:'新詞條 type 16 的數值，單位為角色自身行動回合。只影響主動與輔助技能；0 表示此品質不進入候選池。'};}
  m=path.match(/^balance\.affixes\.cooldownReduction\.(normal|fine|rare|legendary)$/);
  if(m){const q={normal:'普通',fine:'精良',rare:'稀有',legendary:'傳說'};return {label:`${q[m[1]]}指定技能冷卻減少`,help:'若詞條指定主動技能，直接減少該技能的角色自身行動回合；若指定 proc 技能，則轉為觸發率增加。'};}
  if(path==='balance.combat.minimumActiveCooldown')return {label:'主動技能最低冷卻',help:'所有寶石與冷卻詞條扣除後，主動技能仍不能低於此「角色自身行動回合」數。'};
  return actionTurnBalanceMetaBase(path);
};

renderBalanceSettings=function(){

  document.getElementById('app').innerHTML=sectionHead('平衡設定','修改遊戲平衡數值；技能冷卻統一以單位自己的行動回合計算，敵人技能可在此直接新增。',`<button id="resetSettings">恢復此頁預設值</button>`)+

  `<div class="balance-tree">${groups.map(([g,obj])=>{const view=g==='monsters'?Object.fromEntries(Object.entries(obj).filter(([k])=>k!=='skills')):obj;return `<details ${g==='progression'||g==='equipment'||g==='monsters'?'open':''}><summary>${esc(SETTING_GROUP_NAMES[g]||g)} <span class="field-key" style="display:inline;margin-left:6px">balanceSettings.${esc(g)}</span></summary><div class="inside">${flattenSettingLeaves(view,g).map(([p,v])=>settingRow('balanceSettings.'+p,v)).join('')}${g==='monsters'?enemySkillEditorHTML():''}</div></details>`;}).join('')}</div>`;
  const app=document.getElementById('app');
  app.querySelectorAll('.setting-val').forEach(el=>el.onchange=()=>{const full=el.dataset.path,local=full.replace(/^balanceSettings\./,''),old=getByPath(data.balanceSettings,local);try{let v=typeof old==='number'?Number(el.value):typeof old==='boolean'?el.value==='true':el.value;if(typeof old==='number'&&!Number.isFinite(v))throw Error('必須輸入有效數字');setByPath(data.balanceSettings,local,v);markDirty();}catch(e){alert('格式錯誤：'+e.message);render();}});
  bindEnemySkillEditor();
  document.getElementById('resetSettings').onclick=()=>{if(confirmDelete('確定將所有平衡設定恢復為目前修改版遊戲的預設值？角色／技能／裝備名稱等其他資料不受影響。')){data.balanceSettings=structuredClone(BALANCE_SETTINGS_DEFAULTS);markDirty();render();}};
};

const actionTurnValidateDataBase=validateData;
validateData=function(){const issues=actionTurnValidateDataBase();ensureArrays();const s=data.balanceSettings.monsters.skillSystem?.assignChance||{};for(const k of ['normal','elite','boss','final'])if(!Number.isFinite(s[k])||s[k]<0||s[k]>1)issues.push(`敵人技能配置機率 monsters.skillSystem.assignChance.${k} 必須為 0~1。`);const ids=new Set();for(const [i,sk] of data.balanceSettings.monsters.skills.entries()){if(!sk.id||ids.has(sk.id))issues.push(`敵人技能第 ${i+1} 筆 ID 空白或重複。`);ids.add(sk.id);if(!sk.name)issues.push(`敵人技能 ${sk.id||i+1} 缺少名稱。`);if(!Number.isFinite(sk.weight)||sk.weight<=0)issues.push(`敵人技能 ${sk.id||i+1} 抽取權重必須 > 0。`);if(!Number.isFinite(sk.cooldownMin)||!Number.isFinite(sk.cooldownMax)||sk.cooldownMin<0||sk.cooldownMax<sk.cooldownMin)issues.push(`敵人技能 ${sk.id||i+1} 冷卻範圍無效。`);if(!Number.isFinite(sk.power)||sk.power<0)issues.push(`敵人技能 ${sk.id||i+1} 傷害倍率無效。`);}return issues;};

ensureArrays();
render();
</script>

<script id="monster-drop-editor-system">
const MONSTER_KIND_LABELS={normal:'普通怪',boss:'地圖首領',final:'最終首領'};
const DROP_KIND_LABELS={normal:'普通',elite:'菁英',boss:'首領',final:'最終首領'};
const DROP_TYPE_LABELS={sourceMaterial:'怪物自身素材',material:'指定材料',ore:'鍛鐵',dust:'粉塵',gem:'技能寶石',potion:'治療藥水',gear:'一般裝備',gearLegendary:'傳說詞條裝備',bossGear:'BOSS專屬裝備',item:'商店道具'};
function ensureMonsterDropArrays(){data.balance??={};data.balance.affixes??={};data.balance.affixes.extendedValues??={};data.balance.affixes.extendedValues.dropRateBonus??={normal:0,fine:5,rare:10,legendary:20};data.balanceSettings??={};data.balanceSettings.monsters??={};data.balanceSettings.monsters.catalog??=structuredClone(BALANCE_SETTINGS_DEFAULTS.monsters.catalog||[]);data.balanceSettings.drops??={entries:structuredClone(BALANCE_SETTINGS_DEFAULTS.drops?.entries||[])};data.balanceSettings.drops.entries??=[];}
function monsterOptions(selected){return data.balanceSettings.monsters.catalog.map(m=>`<option value="${esc(m.id)}" ${selected?.includes(m.id)?'selected':''}>${esc(MAP_NAMES[m.mapIndex]||('地圖 '+m.mapIndex))}｜${esc(m.name)}｜${esc(m.id)}</option>`).join('');}
function monsterCatalogEditorHTML(){const list=data.balanceSettings.monsters.catalog;return `<section class="md-card"><div class="row"><div><h3>怪物設計</h3><p class="mini-note">怪物 ID 是掉落表的穩定連結。可改名稱，但已被掉落規則引用時不要直接改 ID。新增怪物後會立即出現在掉落來源選單。</p></div><button id="addMonster">新增怪物</button></div>${list.map((m,i)=>`<article class="md-card" data-monster-row="${i}"><div class="row"><h4>${esc(m.name||'未命名怪物')}</h4><div><button class="small monster-copy">複製</button><button class="small danger monster-delete">刪除</button></div></div><div class="md-fields"><label>怪物 ID<input class="monster-field" data-key="id" value="${esc(m.id)}"></label><label>名稱<input class="monster-field" data-key="name" value="${esc(m.name)}"></label><label>地圖<select class="monster-field" data-key="mapIndex">${MAP_NAMES.map((n,mi)=>`<option value="${mi}" ${mi===m.mapIndex?'selected':''}>${mi}｜${esc(n)}</option>`).join('')}</select></label><label>類型<select class="monster-field" data-key="kind">${Object.entries(MONSTER_KIND_LABELS).map(([v,l])=>`<option value="${v}" ${m.kind===v?'selected':''}>${l}</option>`).join('')}</select></label><label>主要素材<input class="monster-field" data-key="material" value="${esc(m.material)}"></label><label>元素<select class="monster-field" data-key="element">${ELEMENTS.map(v=>`<option value="${v}" ${m.element===v?'selected':''}>${esc(ELEMENT_LABELS[v]||v)}</option>`).join('')}</select></label><label>種族<select class="monster-field" data-key="race">${Object.entries({beast:'野獸',plant:'植物',undead:'不死',construct:'構裝',demon:'惡魔',spirit:'精靈'}).map(([v,l])=>`<option value="${v}" ${m.race===v?'selected':''}>${l}</option>`).join('')}</select></label><label>最大掉落物數<input class="monster-field" data-key="maxDrops" type="number" min="0" max="100" step="1" value="${esc(m.maxDrops)}"></label></div></article>`).join('')}</section>`;}
function dropTableEditorHTML(){const list=data.balanceSettings.drops.entries;return `<section class="md-card"><div class="row"><div><h3>怪物掉落表</h3><p class="mini-note drop-algo"><b>掉落率算法：</b>機率欄使用 0~1 小數（0.2 = 20%）。每條規則先獨立判定。<code>實際掉落率 = 該難度基礎率 × (1 + 全隊掉寶率加成)</code>，最高 100%。例如基礎 20%、全隊掉寶 +50% → 30%。若同次擊殺成功項目超過怪物的「最大掉落物數量」，成功項目會隨機取到上限。金幣、經驗、基礎鍛鐵、以太鍛鐵不計入此上限。</p></div><button id="addDropRule">新增掉落物</button></div><datalist id="drop-item-key-list">${data.items.map(x=>`<option value="${esc(x.id)}">${esc(x.name||x.id)}</option>`).join('')}</datalist>${list.map((d,i)=>`<article class="md-card" data-drop-row="${i}"><div class="row"><h4>${esc(d.name||d.id||'未命名掉落')}</h4><div><button class="small drop-copy">複製</button><button class="small danger drop-delete">刪除</button></div></div><div class="md-fields"><label>規則 ID<input class="drop-field" data-key="id" value="${esc(d.id)}"></label><label>顯示名稱<input class="drop-field" data-key="name" value="${esc(d.name)}"></label><label>啟用<select class="drop-field" data-key="enabled"><option value="true" ${d.enabled?'selected':''}>是</option><option value="false" ${!d.enabled?'selected':''}>否</option></select></label><label>掉落類型<select class="drop-field" data-key="type">${Object.entries(DROP_TYPE_LABELS).map(([v,l])=>`<option value="${v}" ${d.type===v?'selected':''}>${l}</option>`).join('')}</select></label><label>材料／寶石／道具 key<input class="drop-field" data-key="key" list="drop-item-key-list" value="${esc(d.key??'')}"></label><label>普通難度機率<input class="drop-chance" data-diff="0" type="number" min="0" max="1" step="0.0001" value="${esc(d.chanceByDifficulty?.[0]??0)}"></label><label>困難難度機率<input class="drop-chance" data-diff="1" type="number" min="0" max="1" step="0.0001" value="${esc(d.chanceByDifficulty?.[1]??0)}"></label><label>地獄難度機率<input class="drop-chance" data-diff="2" type="number" min="0" max="1" step="0.0001" value="${esc(d.chanceByDifficulty?.[2]??0)}"></label><label>最少數量<input class="drop-field" data-key="quantityMin" type="number" min="1" step="1" value="${esc(d.quantityMin)}"></label><label>最多數量<input class="drop-field" data-key="quantityMax" type="number" min="1" step="1" value="${esc(d.quantityMax)}"></label><label>遭遇種類<select class="drop-kinds" multiple size="4">${Object.entries(DROP_KIND_LABELS).map(([v,l])=>`<option value="${v}" ${d.kinds?.includes(v)?'selected':''}>${l}</option>`).join('')}</select></label><label style="grid-column:span 3">可掉落此物的怪物<select class="drop-sources md-sources" multiple>${monsterOptions(d.sources)}</select></label></div></article>`).join('')}</section>`;}
function bindMonsterDropEditors(){const monsters=data.balanceSettings.monsters.catalog,drops=data.balanceSettings.drops.entries;document.querySelectorAll('[data-monster-row]').forEach(card=>{const i=Number(card.dataset.monsterRow),m=monsters[i];card.querySelectorAll('.monster-field').forEach(el=>el.onchange=()=>{const k=el.dataset.key,oldId=m.id;m[k]=el.type==='number'||k==='mapIndex'?Number(el.value):el.value;if(k==='id'&&oldId!==m.id)for(const d of drops)d.sources=(d.sources||[]).map(id=>id===oldId?m.id:id);markDirty();if(['id','name','mapIndex'].includes(k))render();});card.querySelector('.monster-copy').onclick=()=>{const c=structuredClone(m),ids=new Set(monsters.map(x=>x.id));let n=2,base=(c.id||'monster')+'_copy',id=base;while(ids.has(id))id=base+(n++);c.id=id;c.name=(c.name||'怪物')+' 複製';c.kind='normal';monsters.splice(i+1,0,c);markDirty();render();};card.querySelector('.monster-delete').onclick=()=>{if(confirmDelete(`刪除怪物「${m.name}」？引用它的掉落來源也會一起移除。`)){monsters.splice(i,1);for(const d of drops)d.sources=(d.sources||[]).filter(id=>id!==m.id);markDirty();render();}};});const am=document.getElementById('addMonster');if(am)am.onclick=()=>{const ids=new Set(monsters.map(x=>x.id));let n=monsters.length+1,id='custom_monster_'+n;while(ids.has(id))id='custom_monster_'+(++n);monsters.push({id,name:'新怪物',mapIndex:0,kind:'normal',material:'新素材',element:'physical',race:'beast',maxDrops:1});markDirty();render();};document.querySelectorAll('[data-drop-row]').forEach(card=>{const i=Number(card.dataset.dropRow),d=drops[i];card.querySelectorAll('.drop-field').forEach(el=>el.onchange=()=>{const k=el.dataset.key;if(k==='enabled')d[k]=el.value==='true';else if(el.type==='number')d[k]=Number(el.value);else d[k]=el.value;markDirty();if(k==='name'||k==='id'||k==='type')render();});card.querySelectorAll('.drop-chance').forEach(el=>el.onchange=()=>{d.chanceByDifficulty??=[0,0,0];d.chanceByDifficulty[Number(el.dataset.diff)]=Number(el.value);markDirty();});card.querySelector('.drop-kinds').onchange=e=>{d.kinds=[...e.target.selectedOptions].map(o=>o.value);markDirty();};card.querySelector('.drop-sources').onchange=e=>{d.sources=[...e.target.selectedOptions].map(o=>o.value);markDirty();};card.querySelector('.drop-copy').onclick=()=>{const c=structuredClone(d),ids=new Set(drops.map(x=>x.id));let n=2,base=(c.id||'drop')+'_copy',id=base;while(ids.has(id))id=base+(n++);c.id=id;c.name=(c.name||'掉落')+' 複製';drops.splice(i+1,0,c);markDirty();render();};card.querySelector('.drop-delete').onclick=()=>{if(confirmDelete(`刪除掉落規則「${d.name||d.id}」？`)){drops.splice(i,1);markDirty();render();}};});const ad=document.getElementById('addDropRule');if(ad)ad.onclick=()=>{const ids=new Set(drops.map(x=>x.id));let n=drops.length+1,id='custom_drop_'+n;while(ids.has(id))id='custom_drop_'+(++n);drops.push({id,name:'新掉落物',enabled:true,type:'material',key:'新掉落物',kinds:['normal'],chanceByDifficulty:[0.1,0.1,0.1],quantityMin:1,quantityMax:1,sources:monsters.length?[monsters[0].id]:[]});markDirty();render();};}
deepFillDefaults=function deepFillDefaultsMonsterDrops(def,src,path=''){
  if(Array.isArray(def)){
    const dynamic=path==='monsters.skills'||path==='monsters.catalog'||path==='drops.entries'||/^(drops\.entries\.\d+\.(sources|kinds))$/.test(path);
    if(dynamic){if(!Array.isArray(src))return structuredClone(def);if(/\.(sources|kinds)$/.test(path))return structuredClone(src);if(!def.length)return structuredClone(src);const template=def[0];return src.map((v,i)=>deepFillDefaultsMonsterDrops(def[i]===undefined?template:def[i],v,path+'.'+i));}
    return def.map((v,i)=>deepFillDefaultsMonsterDrops(v,Array.isArray(src)?src[i]:undefined,path?path+'.'+i:String(i)));
  }
  if(def&&typeof def==='object'){const out=src&&typeof src==='object'&&!Array.isArray(src)?structuredClone(src):{};for(const [k,v] of Object.entries(def)){const next=path?path+'.'+k:k;out[k]=deepFillDefaultsMonsterDrops(v,src&&typeof src==='object'?src[k]:undefined,next);}return out;}
  return src===undefined?def:src;
};
const monsterDropBalanceMetaBase=balanceMeta;
balanceMeta=function(path){const m=path.match(/^balance\.affixes\.extendedValues\.dropRateBonus\.(normal|fine|rare|legendary)$/);if(m){const q={normal:'普通',fine:'精良',rare:'稀有',legendary:'傳說'};return {label:`${q[m[1]]}掉寶率詞條`,help:'type 17 詞條數值，單位 %。全隊裝備加總後乘上每條掉落規則的基礎機率；最終機率封頂 100%。0 表示此品質不會抽到此詞條。'};}return monsterDropBalanceMetaBase(path);};
const monsterDropEnsureArraysBase=ensureArrays;ensureArrays=function(){monsterDropEnsureArraysBase();ensureMonsterDropArrays();};
const monsterDropRenderSettingsBase=renderBalanceSettings;
renderBalanceSettings=function(){ensureArrays();const groups=Object.entries(data.balanceSettings);document.getElementById('app').innerHTML=sectionHead('平衡設定','修改遊戲平衡數值、怪物設計與逐怪掉落表。',`<button id="resetSettings">恢復此頁預設值</button>`)+`<div class="notice"><b>掉寶率：</b>每條掉落規則都有普通／困難／地獄三個基礎機率。裝備「掉寶率」詞條以全隊加總後乘算，例如 20% × (1 + 50%) = 30%，最終不超過 100%。</div><div class="balance-tree">${groups.map(([g,obj])=>{let view=obj;if(g==='monsters')view=Object.fromEntries(Object.entries(obj).filter(([k])=>!['skills','catalog'].includes(k)));if(g==='drops')view=Object.fromEntries(Object.entries(obj).filter(([k])=>k!=='entries'));return `<details ${['progression','equipment','monsters','drops'].includes(g)?'open':''}><summary>${esc(SETTING_GROUP_NAMES[g]||({drops:'掉落設定'}[g])||g)} <span class="field-key" style="display:inline;margin-left:6px">balanceSettings.${esc(g)}</span></summary><div class="inside">${flattenSettingLeaves(view,g).map(([p,v])=>settingRow('balanceSettings.'+p,v)).join('')}${g==='monsters'?enemySkillEditorHTML()+monsterCatalogEditorHTML():g==='drops'?dropTableEditorHTML():''}</div></details>`;}).join('')}</div>`;const app=document.getElementById('app');app.querySelectorAll('.setting-val').forEach(el=>el.onchange=()=>{const full=el.dataset.path,local=full.replace(/^balanceSettings\./,''),old=getByPath(data.balanceSettings,local);try{let v=typeof old==='number'?Number(el.value):typeof old==='boolean'?el.value==='true':el.value;if(typeof old==='number'&&!Number.isFinite(v))throw Error('必須輸入有效數字');setByPath(data.balanceSettings,local,v);markDirty();}catch(e){alert('格式錯誤：'+e.message);render();}});bindEnemySkillEditor();bindMonsterDropEditors();document.getElementById('resetSettings').onclick=()=>{if(confirmDelete('確定恢復平衡設定預設值？')){data.balanceSettings=structuredClone(BALANCE_SETTINGS_DEFAULTS);markDirty();render();}};};

<script>
/* Update 16: editor validation parity with game monster/drop schema. */
const update16EditorValidateBase=validateData;
validateData=function(){
  const issues=update16EditorValidateBase();ensureArrays();
  const cat=data.balanceSettings?.monsters?.catalog||[],drops=data.balanceSettings?.drops?.entries||[];
  const ids=new Set(),monsterById=new Map(),races=new Set(['beast','plant','undead','construct','demon','spirit']),monsterKinds=new Set(Object.keys(MONSTER_KIND_LABELS)),dropKinds=new Set(Object.keys(DROP_KIND_LABELS)),dropTypes=new Set(Object.keys(DROP_TYPE_LABELS));
  for(const [i,m] of cat.entries()){
    if(typeof m?.id!=='string'||!/^[a-zA-Z0-9_-]{1,100}$/.test(m.id)||ids.has(m.id))issues.push(`怪物第 ${i+1} 筆 ID 必須為 1~100 字元英數、底線或連字號，且不可重複。`);
    if(m?.id)ids.add(m.id);if(m?.id)monsterById.set(m.id,m);
    if(typeof m?.name!=='string'||!m.name.trim())issues.push(`怪物 ${m?.id||i+1} 名稱不可空白。`);
    if(!Number.isInteger(m?.mapIndex)||m.mapIndex<0||m.mapIndex>=MAP_NAMES.length)issues.push(`怪物 ${m?.id||i+1} 地圖索引無效。`);
    if(!monsterKinds.has(m?.kind))issues.push(`怪物 ${m?.id||i+1} 類型無效。`);
    if(typeof m?.material!=='string'||!m.material.trim())issues.push(`怪物 ${m?.id||i+1} 主要素材不可空白。`);
    if(!ELEMENTS.includes(m?.element))issues.push(`怪物 ${m?.id||i+1} 元素無效。`);
    if(!races.has(m?.race))issues.push(`怪物 ${m?.id||i+1} 種族無效。`);
    if(Number.isInteger(m?.mapIndex)&&m.mapIndex>=0&&m.mapIndex<MAP_NAMES.length&&monsterKinds.has(m?.kind)){const expected=m.mapIndex===6?'final':'boss';if(m.kind!=='normal'&&m.kind!==expected)issues.push(`怪物 ${m.id||i+1} 類型與地圖不相容：終焉王座使用最終首領，其餘地圖使用地圖首領。`);}
  }
  const dids=new Set();
  for(const [i,d] of drops.entries()){
    if(typeof d?.id!=='string'||!/^[a-zA-Z0-9_-]{1,120}$/.test(d.id)||dids.has(d.id))issues.push(`掉落規則第 ${i+1} 筆 ID 必須為 1~120 字元英數、底線或連字號，且不可重複。`);
    if(d?.id)dids.add(d.id);
    if(typeof d?.name!=='string'||!d.name.trim())issues.push(`掉落規則 ${d?.id||i+1} 顯示名稱不可空白。`);
    if(typeof d?.enabled!=='boolean')issues.push(`掉落規則 ${d?.id||i+1} enabled 必須是布林值。`);
    if(!dropTypes.has(d?.type))issues.push(`掉落規則 ${d?.id||i+1} 掉落類型無效。`);
    if(!Array.isArray(d?.kinds)||!d.kinds.length||d.kinds.some(k=>!dropKinds.has(k)))issues.push(`掉落規則 ${d?.id||i+1} 遭遇種類無效。`);
    if(!Number.isInteger(d?.quantityMin)||!Number.isInteger(d?.quantityMax)||d.quantityMin<1||d.quantityMax<d.quantityMin||d.quantityMax>999)issues.push(`掉落規則 ${d?.id||i+1} 數量必須是 1~999 整數，且最大值不可小於最小值。`);
    if(d?.type==='material'&&(typeof d.key!=='string'||!d.key.trim()))issues.push(`掉落規則 ${d?.id||i+1} 的指定材料名稱不可空白。`);
    if(d?.type==='gem'&&d.key!=='random'&&![0,1,2,'0','1','2'].includes(d.key))issues.push(`掉落規則 ${d?.id||i+1} 的寶石 key 只能是 random、0、1、2。`);
    if(d?.type==='item'&&!data.items.some(x=>x.id===d.key))issues.push(`掉落規則 ${d?.id||i+1} 指定的商店道具不存在。`);
    if(Array.isArray(d?.sources)&&Array.isArray(d?.kinds)){const kinds=new Set(d.kinds);for(const id of d.sources){const m=monsterById.get(id);if(!m)continue;const compatible=m.kind==='normal'?['normal','elite']:[m.kind];if(!compatible.some(k=>kinds.has(k)))issues.push(`掉落規則 ${d.id||i+1} 的來源「${m.name||id}」與遭遇種類不相容。`);}}
  }
  return [...new Set(issues)];
};
</script>

    for(let mi=0;mi<maps.length;mi++){const final=maps[mi].mapType==='final',expected=final?'final':'boss',boss=cat.filter(m=>m.mapIndex===mi&&m.kind===expected),normal=cat.filter(m=>m.mapIndex===mi&&m.kind==='normal'&&m.enabled!==false);if(boss.length!==1)issues.push(`${maps[mi].name} 必須恰好有 1 筆${final?'最終首領':'BOSS'}資料。`);if(!final&&!normal.length)issues.push(`${maps[mi].name} 至少需要 1 隻啟用中的普通怪物。`);if(final){const total=(boss.length?1:0)+normal.reduce((sum,m)=>sum+(Number(m.stageCount)||0),0);if(total<1||total>20)issues.push(`${maps[mi].name} 的終局關卡總敵人數必須為 1～20 隻。`);}}
    return [...new Set(issues)];

<script id="manual-boss-challenge-editor">

      if(section){const body=section.querySelector('.card-b');if(body)body.insertAdjacentHTML('afterbegin',`<p class="mini-note">一般探索只會從「啟用」的普通怪中抽取普通／菁英；BOSS 不再隨機出現。BOSS 關卡內容由下方每隻怪物的「BOSS 關卡數量／型態／隊列」設定；普通怪即使停用一般探索，也可以作為 BOSS 關卡專用隨從。</p><p class="mini-note">目前 BOSS 關卡總數：${bossStageTotal(mi)} 隻（含 1 名 BOSS）。</p>`);}

  const bossEditorValidateBase=validateData;

    const issues=bossEditorValidateBase();ensureArrays();const b=data.balanceSettings.monsters.bossMeter,maps=data.balanceSettings.maps.catalog,cat=data.balanceSettings.monsters.catalog;

})();
</script>

<script id="turn-duration-editor-system">
(function installTurnDurationEditorSystem(){
  const TIME_UNITS={supportDuration:'battleRounds',itemDuration:'battleRounds'};
  function roundReferenceMs(obj){return Math.max(1,Number(obj?.balanceSettings?.combat?.pacing?.roundMinimumMs)||6000);}
  function normalizeTurnUnitsInPlace(obj){
    if(!obj||typeof obj!=='object')return obj;
    const legacyItems=obj?.timeUnits?.itemDuration!=='battleRounds',refSec=roundReferenceMs(obj)/1000;
    if(Array.isArray(obj.items)&&legacyItems)for(const item of obj.items)if(Number.isFinite(item.duration))item.duration=Math.max(1,Math.ceil(Math.max(0,item.duration)/refSec));
    obj.timeUnits={...(obj.timeUnits||{}),...TIME_UNITS};
    if(obj._reference?.units){obj._reference.units.duration='BUFF／DEBUFF 為戰鬥回合；消耗品為角色出戰回合';obj._reference.units.cooldown='技能冷卻為施放者自身行動回合';}
    obj.notes=[...new Set([...(obj.notes||[]).filter(x=>!String(x).includes('BUFF／DEBUFF 與消耗品持續時間統一為回合制')),'supportSkills[].duration 單位為戰鬥回合；其數值原本實際就是依 partyClock 回合推進，因此舊數值直接保留。','items[].duration 單位為角色出戰的戰鬥回合；舊版現實秒會依 1× 每回合最短時間換算為回合後匯入。'])];
    return obj;
  }
  globalThis.normalizeTurnUnitsInPlace=normalizeTurnUnitsInPlace;
  normalizeTurnUnitsInPlace(data);
  const turnEnsureArraysBase=ensureArrays;
  ensureArrays=function(){const out=turnEnsureArraysBase();if(data?.timeUnits?.itemDuration!=='battleRounds'||data?.timeUnits?.supportDuration!=='battleRounds')normalizeTurnUnitsInPlace(data);return out;};
  const turnValidateBase=validateData;
  validateData=function(){const issues=turnValidateBase();ensureArrays();for(const [ci,list] of (data.supportSkills||[]).entries())for(const [si,sk] of (list||[]).entries()){if(!Number.isInteger(sk.duration)||sk.duration<0)issues.push(`角色 ${ci} 輔助技能 ${si} 的持續回合必須是非負整數。`);if(!Number.isInteger(sk.cooldown)||sk.cooldown<0)issues.push(`角色 ${ci} 輔助技能 ${si} 的冷卻自身回合必須是非負整數。`);}for(const item of data.items||[])if(!Number.isInteger(item.duration)||item.duration<0)issues.push(`道具 ${item.id} 的持續出戰回合必須是非負整數。`);return [...new Set(issues)];};
  const turnRenderBase=render;
  render=function(){turnRenderBase();if(currentSection==='support'){const head=document.querySelector('.section-head p');if(head)head.textContent='輔助技能持續時間以戰鬥回合計算；冷卻以施放者自身行動回合計算。';}if(currentSection==='items'){const head=document.querySelector('.section-head p');if(head)head.textContent='消耗品效果持續時間以角色出戰的戰鬥回合計算；暫停、候補與關閉頁面不會扣減。';}};
  /* Rebind raw/import paths indirectly through ensureArrays; normalize the currently loaded data now. */
  markDirty('已將 BUFF／DEBUFF 與消耗品持續時間統一為回合制；尚未匯出');
  render();
})();
</script>

  function potionRows(){return data.items.map((x,i)=>({x,i})).filter(v=>isHeal(v.x));}
  function uniquePotionId(){const used=new Set(data.items.map(x=>x.id));let n=1,id;do{id='heal_custom_'+n++;}while(used.has(id));return id;}

  normalizeAllSupportMechanics();

  function valueHelp(sk){
    if(sk.kind==='followup')return `0~1 小數。追打基礎傷害＝施放者攻擊力 × 此比例；之後依序套用目標防禦、element 屬性克制與目標減傷。追打不暴擊，也不再次吃 damageAmp / vulnerable。`;
    if(sk.kind==='dotAttack')return `0~1 小數。目標每次自身行動前，直接受到「施放者攻擊力 × 此比例」固定傷害；不吃防禦、抗性、增傷、減傷、暴擊或屬性克制。`;
    if(sk.kind==='dotMaxHp')return `0~1 小數。目標每次自身行動前，直接受到「目標最大生命 × 此比例」固定傷害；不吃防禦、抗性、增傷、減傷、暴擊或屬性克制。`;
    if(sk.kind==='damageAmp')return `0~1 小數。目標受到攻擊時，只把該次攻擊傷害提高此比例；例如 0.20 = 該次傷害 +20%。`;
    return `使用 0~1 小數，例如 0.18 = 18%。目前值約 ${percentPreview(sk.value)}；技能升級每級再增加基礎效果的 20%。`;
  }
  function elementHelp(sk){
    if(sk.kind==='followup')return '追打的實際傷害屬性，可設定無／火／冰／風／光／暗。會依屬性克制計算，並同時受到目標防禦與減傷影響。';
    return '只有「追打 DEBUFF」會用此欄位計算屬性克制；其他輔助效果僅保留標示，不參與傷害公式。';
  }

  renderSupport=function(){
    ensureArrays();
    selected.supportClass=Math.min(selected.supportClass,Math.max(0,data.classes.length-1));
    const group=data.supportSkills[selected.supportClass]||[];
    selected.support=Math.min(selected.support,Math.max(0,group.length-1));
    const sk=normalizeSupportMechanic(group[selected.support]);
    document.getElementById('app').innerHTML=
      sectionHead('輔助技能','每職業固定三個輔助技能。此頁除了原本 BUFF／DEBUFF，也可直接設定追打、兩種固定傷害 DOT 與受擊增傷。')+
      `<div class="notice">每級輔助技能會把基礎效果乘上 1 + (技能等級−1)×20%；最高 5 級。第 3 個輔助技能（索引 2）另外固定要求二轉。</div>`+
      `<div class="support-mechanic-note"><b>DEBUFF 傷害規則：</b>追打＝目標受到攻擊後，額外受到施放者攻擊力 × value 的獨立屬性傷害，會套用目標防禦、element 屬性克制與目標減傷；DOT＝目標自身行動前直接扣固定傷害，兩種 DOT 都完全不吃增傷／減傷／防禦／抗性／暴擊／屬性克制；額外增傷＝只放大觸發它的那次攻擊。</div>`+
      `<div class="oknotice">持續時間＝全隊戰鬥回合；冷卻＝施放者自身行動回合。DOT 的傷害觸發點則是「受到 DEBUFF 的目標自身行動前」。</div>`+
      `<div class="toolbar"><label style="margin:0">角色</label><select id="supportClassSel">${data.classes.map((x,i)=>`<option value="${i}" ${i===selected.supportClass?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div>`+
      `<div class="grid2"><div class="card"><div class="list">${group.map((x,i)=>`<div class="listitem ${i===selected.support?'active':''}" data-support="${i}"><div class="title">${esc(x.name||'(未命名)')}</div><div class="sub">${esc(SUPPORT_KIND_LABELS[x.kind]||x.kind)} · ${esc(SUPPORT_TARGET_LABELS[x.target]||x.target)} · 需求 LV.${esc(x.level)}</div></div>`).join('')||'<div class="empty">缺少輔助技能資料</div>'}</div></div>`+
      (sk?card('輔助技能資料',`<div class="fields">
        ${inputField('技能 ID（識別用）','id',sk.id||'','text','',false,'套用時會移除 id，執行階段以陣列索引識別；建議保持原值。',true)}
        ${inputField('技能名稱','name',sk.name||'','text','',false,'技能頁與戰鬥紀錄顯示名稱。')}
        ${selectField('作用目標','target',sk.target||'allies',SUPPORT_TARGETS,false,'決定效果套用對象。敵方單體固定目前集火目標。',SUPPORT_TARGET_LABELS)}
        ${selectField('效果類型／DEBUFF 機制','kind',sk.kind||'attack',SUPPORT_KINDS,false,'followup、dotAttack、dotMaxHp、damageAmp 為新增機制；舊 vulnerable 只為舊 JSON 相容，載入後會自動轉換。',SUPPORT_KIND_LABELS)}
        ${selectField('技能／追打屬性','element',sk.element||'physical',ELEMENTS,false,elementHelp(sk),ELEMENT_LABELS)}
        ${inputField('基礎效果比例','value',sk.value??0,'number','min=0 step=0.001',false,valueHelp(sk))}
        ${inputField('持續時間（戰鬥回合）','duration',sk.duration??0,'number','min=0 step=1',false,'BUFF／DEBUFF 依全隊戰鬥回合計時。DOT 只有在效果仍有效時，才會於目標自身行動前觸發。')}
        ${inputField('冷卻時間（自身行動回合）','cooldown',sk.cooldown??0,'number','min=0 step=1',false,'只有施放者自己的行動回合會扣除冷卻；其他角色、敵人與戰鬥倍速都不會額外推進。')}
        ${inputField('需求等級','level',sk.level??1,'number','min=1 step=1',false,'達到此角色等級後才能學習；索引 2 的第三個輔助技能另外固定要求二轉。')}
        ${textareaField('技能風味說明','description',sk.description||'','完全手寫，只負責顯示文字，不參與效果計算。')}
      </div>`):card('輔助技能資料','<div class="empty">每個職業應有 3 個輔助技能；目前 JSON 結構不完整。</div>'))+'</div>';
    const app=document.getElementById('app'),sel=document.getElementById('supportClassSel');
    if(sel)sel.onchange=()=>{selected.supportClass=Number(sel.value);selected.support=0;render();};
    app.querySelectorAll('[data-support]').forEach(x=>x.onclick=()=>{selected.support=Number(x.dataset.support);render();});
    if(sk){
      bindObjectFields(app,sk);
      const kind=app.querySelector('select[data-key="kind"]');
      if(kind)kind.onchange=()=>{sk.kind=kind.value;normalizeSupportMechanic(sk);markDirty();render();};
    }
  };

  if(typeof validateData==='function'){
    const debuffValidateBase=validateData;
    validateData=function(){
      const issues=debuffValidateBase();ensureArrays();
      for(const [ci,list] of (data.supportSkills||[]).entries())for(const [si,sk] of (list||[]).entries()){
        normalizeSupportMechanic(sk);
        if(!SUPPORT_KINDS.includes(sk.kind))issues.push(`角色 ${ci} 輔助技能 ${si} 的效果類型無效。`);
        if(!ELEMENTS.includes(sk.element))issues.push(`角色 ${ci} 輔助技能 ${si} 的屬性無效。`);
        if(!Number.isFinite(sk.value)||sk.value<0)issues.push(`角色 ${ci} 輔助技能 ${si} 的基礎效果比例必須是非負數。`);
        if(['followup','dotAttack','dotMaxHp','damageAmp'].includes(sk.kind)&&!['enemy','enemies'].includes(sk.target))issues.push(`角色 ${ci} 輔助技能 ${si} 使用傷害型 DEBUFF 時，目標應為 enemy 或 enemies。`);
      }
      return [...new Set(issues)];
    };
  }

  data.notes=[...new Set([...(data.notes||[]),
    '輔助 DEBUFF 新機制：followup=受擊時以施放者攻擊力%造成可設定屬性的追打，會套用防禦、屬性克制與目標減傷；dotAttack=目標行動前受到施放者攻擊力%的固定傷害；dotMaxHp=目標行動前受到自身最大生命%的固定傷害；damageAmp=受到攻擊時該次傷害增加%。',

  markDirty('已加入追打、DOT 與額外增傷 DEBUFF 機制；尚未匯出');
  render();
})();
</script>

<script id="verified-balance-contract-editor-filter">
/* Hide compatibility-only fields that no longer drive the current runtime.
   Their JSON values are preserved for old saves/configs, but the editor does not
   present them as active controls. */
(function installVerifiedBalanceContractEditorFilter(){
  const hiddenSettingPath=p=>
    /^quests\.market(?:\.|$)/.test(p) ||
    /^quests\.potion(?:\.|$)/.test(p) ||
    p==='monsters.encounter.bossChance' ||
    /^difficulty\.materialChance(?:\.|$)/.test(p) ||
    /^difficulty\.modes\.\d+\.(?:equipmentChance|gemChance|bossGearChance|legendaryGearChance)(?:\.|$)/.test(p) ||
    p==='rewards.potionDropChance' ||
    /^rewards\.radiant(?:\.|$)/.test(p);
  flattenSettingLeaves=function(v,path='',out=[]){
    if(Array.isArray(v)){v.forEach((x,i)=>flattenSettingLeaves(x,path?path+'.'+i:String(i),out));return out;}
    if(v&&typeof v==='object'){for(const [k,x] of Object.entries(v))flattenSettingLeaves(x,path?path+'.'+k:k,out);return out;}
    if(!hiddenSettingPath(path))out.push([path,v]);
    return out;
  };
  const baseSettingMeta=settingMeta;
  settingMeta=function(path){
    const p=String(path).replace(/^balanceSettings\./,'');
    if(p==='monsters.encounter.eliteChance')return {label:'新增一般地圖預設菁英率',help:'只作為新增一般地圖時的預設值；既有地圖請在「地圖與怪物」頁直接修改 eliteChance。'};
    if(p==='combat.autoPotionThreshold')return {label:'角色自動喝藥預設門檻',help:'新角色或尚未建立個人門檻時使用的預設比例；角色之後可在戰鬥頁各自設定 HP 百分比。'};
    if(p==='progression.starting.potions')return {label:'新帳號起始標準治療藥水',help:'建立新隊伍時的舊制起始數量會遷移到目前的標準治療藥水共用庫存。'};
    return baseSettingMeta(path);
  };
  render();
})();
</script>

    if(!Array.isArray(p.bossAffixes)||p.bossAffixes.length!==DEFAULT_BOSS_AFFIXES.length)issues.push('BOSS 專屬詞綴資料不完整。');else for(const x of p.bossAffixes){const keys=(x.effects||[]).map(e=>e?.key);if(typeof x.name!=='string'||!x.name.trim()||!Array.isArray(x.effects)||x.effects.length!==3||new Set(keys).size!==3||keys.some(k=>!BOSS_EFFECT_KEYS.includes(k)))issues.push('BOSS 專屬詞綴 '+(x.id||'未知')+' 必須正好有三條互不重複的有效屬性。');for(const e of x.effects||[])if(e?.key==='basicElement'&&!VALID_ELEMENTS.includes(e.value))issues.push('BOSS 專屬詞綴 '+x.id+' 的元素無效。');}
    if(!Array.isArray(p.strength.multipliers)||p.strength.multipliers.length!==10||p.strength.multipliers.some(x=>!Number.isFinite(x)||x<=0))issues.push('T1～T10 能力倍率必須各有 1 個大於 0 的數值。');
    for(let d=0;d<3;d++){const w=p.strength.weightsByDifficulty?.[d];if(!Array.isArray(w)||w.length!==10||w.some(x=>!Number.isFinite(x)||x<0)||w.reduce((a,b)=>a+b,0)<=0)issues.push(['普通','困難','地獄'][d]+'的 T 階級權重必須有至少一個大於 0。');}
    if(!Number.isFinite(p.rerollItem.shopChance)||p.rerollItem.shopChance<0||p.rerollItem.shopChance>1||!Number.isFinite(p.rerollItem.shopPrice)||p.rerollItem.shopPrice<1)issues.push('強度重鑄石的商店出現率必須為 0~1，價格至少 1。');
    return [...new Set(issues)];
  };

  data.notes=(data.notes||[]).filter(x=>!String(x).includes('equipmentPowerSystem.prefixes')&&!String(x).includes('seriesPrefixes')&&!String(x).includes('冠名詞綴'));
  data.notes.push('equipmentPowerSystem schemaVersion=2：prefixes / suffixes 各固定一條效果；bossAffixes 每個 BOSS 系列固定三條專屬效果。','一般裝備 raw ATK/HP/DEF 由 equipmentForms 基底與 T 階級決定；前後綴不提供 raw 基礎數值。','BOSS 專屬裝備沒有前後綴與隨機洗鍊詞條；bossAffixes 三條可使用前綴／後綴／基底效果及 bossDamagePct。');
  data.notes=[...new Set(data.notes)];
  render();
})();
</script>



<style id="workspace-architecture-style">
.workspace-topbar{gap:8px;flex-wrap:wrap}
.workspace-meta{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.workspace-chip{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;padding:3px 7px;font-size:10px;color:var(--muted);white-space:nowrap}
.workspace-dashboard{display:grid;grid-template-columns:repeat(4,minmax(140px,1fr));gap:9px;margin:12px 0}
.workspace-dashboard>div{border:1px solid var(--line);border-radius:8px;background:#151a20;padding:10px}
.workspace-dashboard b{display:block;font-size:12px;margin-bottom:5px}
.workspace-dashboard span{font-size:11px;color:var(--muted);line-height:1.45}
.workspace-flow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:10px 0}
.workspace-flow .workspace-step{border:1px solid var(--line);border-radius:6px;padding:6px 9px;background:#151a20;font-size:11px}
.workspace-flow .workspace-arrow{color:var(--muted)}
#releaseBtn{border-color:#8d7040}
@media(max-width:900px){.workspace-dashboard{grid-template-columns:repeat(2,minmax(140px,1fr))}.workspace-meta{order:3;width:100%}}
</style>
<script id="workspace-architecture-system">
(function installWorkspaceArchitecture(){
  const META=globalThis.__EMBERWILD_EDITOR_WORKSPACE_META||{revision:0,savedAt:null,source:'內建預設'};
  let workspaceRevision=Math.max(0,Number(META.revision)||0);
  let workspaceSavedAt=META.savedAt||null;
  let workspaceSource=META.source||'內建預設';
  let autosaveTimer=0;

  function fmt(ts){
    if(!ts)return '尚未自動儲存';
    try{return new Intl.DateTimeFormat('zh-TW',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(new Date(ts));}
    catch{return String(ts);}
  }
  function updateWorkspaceChrome(statusText){
    const v=document.getElementById('editorVersionChip'),r=document.getElementById('workspaceRevisionChip'),t=document.getElementById('workspaceTimeChip'),s=document.getElementById('status');
    if(v)v.textContent='Editor '+EDITOR_VERSION;
    if(r)r.textContent='本機版次 '+workspaceRevision;
    if(t)t.textContent='自動儲存 '+fmt(workspaceSavedAt);
    if(s){
      s.className='status saved';
      s.textContent=statusText||('工作資料：'+workspaceSource);
    }
  }
  function persistWorkspace(reason='自動儲存'){
    clearTimeout(autosaveTimer);
    try{
      ensureArrays();
      workspaceRevision++;
      workspaceSavedAt=new Date().toISOString();
      localStorage.setItem(EDITOR_WORKSPACE_KEY,JSON.stringify({data,revision:workspaceRevision,savedAt:workspaceSavedAt,source:workspaceSource}));
      localStorage.removeItem(EDITOR_LEGACY_DRAFT_KEY);
      dirty=false;
      updateWorkspaceChrome(reason+' · '+fmt(workspaceSavedAt));
      return true;
    }catch(e){
      const s=document.getElementById('status');
      dirty=true;
      if(s){s.className='status unsaved';s.textContent='自動儲存失敗：'+e.message;}
      return false;
    }
  }
  function scheduleWorkspaceSave(reason='已修改'){
    clearTimeout(autosaveTimer);
    dirty=true;
    const s=document.getElementById('status');
    if(s){s.className='status unsaved';s.textContent=reason+' · 等待自動儲存';}
    autosaveTimer=setTimeout(()=>persistWorkspace('已自動儲存'),180);
  }

  markDirty=function(msg='已修改'){scheduleWorkspaceSave(msg);renderNav();};
  markSaved=function(msg='已匯出'){persistWorkspace(msg);};

  const cache=document.getElementById('cacheBtn');
  if(cache){cache.textContent='立即儲存';cache.onclick=()=>persistWorkspace('已手動儲存');}
  const restore=document.getElementById('restoreBtn');
  if(restore){
    restore.textContent='還原內建預設';
    restore.onclick=()=>{
      if(!confirmDelete('確定將目前工作資料還原為這份平衡器內建的預設設定？本機自動草稿會被覆蓋。'))return;
      data=structuredClone(ORIGINAL_DATA);workspaceSource='內建預設';selected={class:0,skillClass:0,skill:0,supportClass:0,support:0,equipClass:0,equipSlot:0,equip:0,item:0,generic:{monsters:0,drops:0,enhancement:0}};
      ensureArrays();persistWorkspace('已還原內建預設');render();
    };
  }

  const importBtn=document.getElementById('importBtn'),fileInput=document.getElementById('fileInput');
  if(importBtn)importBtn.onclick=()=>fileInput?.click();
  if(fileInput)fileInput.onchange=async ev=>{
    const file=ev.target.files?.[0];ev.target.value='';if(!file)return;
    try{
      const parsed=JSON.parse(await file.text());
      if(!parsed||parsed.schema!=='emberwild-balance-v1')throw Error('schema 必須是 emberwild-balance-v1');
      data=parsed;ensureArrays();workspaceSource=file.name;selected={class:0,skillClass:0,skill:0,supportClass:0,support:0,equipClass:0,equipSlot:0,equip:0,item:0,generic:{monsters:0,drops:0,enhancement:0}};
      persistWorkspace('已開啟 '+file.name);render();
    }catch(err){alert('無法開啟平衡 JSON：'+err.message);}
  };

  function exportWorkspace(kind){
    ensureArrays();
    const issues=validateData();
    if(kind==='release'&&issues.length){
      alert('正式實裝 JSON 必須先通過相容性檢查。目前仍有 '+issues.length+' 個提醒：\n\n'+issues.slice(0,12).join('\n'));
      currentSection='overview';render();return;
    }
    if(kind==='test'&&issues.length&&!confirm('目前有 '+issues.length+' 個資料提醒。仍要匯出測試 JSON 嗎？\n\n'+issues.slice(0,8).join('\n')))return;
    const now=new Date(),stamp=now.getFullYear()+String(now.getMonth()+1).padStart(2,'0')+String(now.getDate()).padStart(2,'0')+'-'+String(now.getHours()).padStart(2,'0')+String(now.getMinutes()).padStart(2,'0');
    const filename=kind==='release'?('emberwild-balance-release-'+stamp+'.json'):'emberwild-balance-test.json';
    downloadText(filename,JSON.stringify(data,null,2),'application/json;charset=utf-8');
    persistWorkspace((kind==='release'?'已匯出正式 JSON':'已匯出測試 JSON')+' · '+filename);
  }
  const exportBtn=document.getElementById('exportBtn');
  if(exportBtn){exportBtn.textContent='匯出測試 JSON';exportBtn.onclick=()=>exportWorkspace('test');}
  const releaseBtn=document.getElementById('releaseBtn');
  if(releaseBtn)releaseBtn.onclick=()=>exportWorkspace('release');

  const overviewBase=renderOverview;
  renderOverview=function(){
    overviewBase();
    const app=document.getElementById('app');if(!app)return;
    const head=app.querySelector('.section-head');
    const box=document.createElement('section');
    box.className='card';
    box.innerHTML='<div class="card-h"><strong>本機工作區</strong><span class="pill">程式與平衡資料分離</span></div><div class="card-b">'+
      '<div class="workspace-dashboard">'+
        '<div><b>目前來源</b><span>'+esc(workspaceSource)+'</span></div>'+
        '<div><b>本機版次</b><span>'+workspaceRevision+'</span></div>'+
        '<div><b>最後自動儲存</b><span>'+esc(fmt(workspaceSavedAt))+'</span></div>'+
        '<div><b>正式匯出條件</b><span>相容性檢查必須 0 提醒</span></div>'+
      '</div>'+
      '<div class="mini-note">現在平衡器 HTML 視為「編輯程式」，平衡數值視為「工作資料」。每次修改都會自動備份到這個瀏覽器的本機工作區；平常不需要再按「儲存草稿」。要帶到遊戲測試時匯出測試 JSON；確認後再匯出正式 JSON。</div>'+
      '<div class="workspace-flow"><span class="workspace-step">本機平衡器</span><span class="workspace-arrow">→</span><span class="workspace-step">自動草稿</span><span class="workspace-arrow">→</span><span class="workspace-step">測試 JSON</span><span class="workspace-arrow">→</span><span class="workspace-step">chatgpt-dev</span><span class="workspace-arrow">→</span><span class="workspace-step">正式 JSON / main</span></div>'+
      '<div class="notice" style="margin:10px 0 0"><b>注意：</b>本機草稿屬於目前瀏覽器與這份 HTML 的儲存空間。清除網站資料、換瀏覽器或移動到無法共用儲存空間的環境時，仍應保留最近匯出的 JSON 作為可攜備份。</div>'+
      '</div>';
    if(head?.nextSibling)app.insertBefore(box,head.nextSibling);else app.appendChild(box);
  };

  // Keep the existing overview reset button, but its markDirty now writes the
  // replacement data to the local workspace automatically.
  ensureArrays();
  persistWorkspace(META.savedAt?'已載入本機自動草稿':'已建立本機工作區');
  render();
})();
</script>

</html>
