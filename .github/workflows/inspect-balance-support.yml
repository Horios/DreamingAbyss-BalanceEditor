name: Inspect support editor extension points

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/inspect-balance-support.yml

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Print snippets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text=Path('balance-editor.html').read_text(encoding='utf-8')
          for key in ['function renderSupport','function renderStatuses','function modifierRowsHtml','const EFFECT_NAMES','EFFECT_NAMES=','supportEffect','data.supportSkills','validateData=function','function validateData','statusDuration','data-status-mod-kind']:
              print('\n===== '+key+' =====')
              start=0
              for _ in range(5):
                  i=text.find(key,start)
                  if i<0: break
                  print(text[max(0,i-2200):min(len(text),i+6500)])
                  print('\n---')
                  start=i+len(key)
          PY
