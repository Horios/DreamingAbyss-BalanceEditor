name: One-time basicElement editor migration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Migrate embedded equipment data and editor copy
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, json, re

          path = Path('balance-editor.html')
          text = path.read_text(encoding='utf-8')

          m = re.search(r'const ORIGINAL_B64\s*=\s*"([A-Za-z0-9+/=]+)";', text)
          if not m:
              raise SystemExit('ORIGINAL_B64 not found')
          data = json.loads(base64.b64decode(m.group(1)).decode('utf-8'))

          elements = {'physical','fire','ice','wind','light','shadow'}
          legacy_direct = ['crit','critDamage','pierce','lifesteal','evasion','elementBonus','defenseIgnore']
          affected = []
          for job, slots in enumerate(data.get('equipmentForms', [])):
              for slot, forms in enumerate(slots or []):
                  for index, form in enumerate(forms or []):
                      if not isinstance(form, dict) or 'element' not in form:
                          continue
                      element = form.get('element')
                      rows = [dict(x) for x in form.get('fixedEffects', []) if isinstance(x, dict)]
                      if not rows:
                          ex = dict(form.get('exclusive') or {}) if isinstance(form.get('exclusive'), dict) else {}
                          def pct(value):
                              return round((float(value)-1)*100, 2)
                          if isinstance(form.get('atk'), (int,float)) and form['atk'] != 1:
                              ex['gearAtkPct'] = ex.get('gearAtkPct', 0) + pct(form['atk'])
                          if isinstance(form.get('hp'), (int,float)) and form['hp'] != 1:
                              ex['gearHpPct'] = ex.get('gearHpPct', 0) + pct(form['hp'])
                          if isinstance(form.get('def'), (int,float)) and form['def'] != 1:
                              ex['gearDefPct'] = ex.get('gearDefPct', 0) + pct(form['def'])
                          for key in legacy_direct:
                              value = form.get(key)
                              if isinstance(value, (int,float)) and value != 0:
                                  ex[key] = ex.get(key, 0) + value
                          mana_attack = 0
                          if isinstance(form.get('mp'), (int,float)) and form['mp'] > 0:
                              mana_attack += max(1, round(form['mp']/15))
                          if isinstance(form.get('mpRegen'), (int,float)) and form['mpRegen'] > 0:
                              mana_attack += max(1, round(form['mpRegen']))
                          if mana_attack:
                              ex['attackPct'] = ex.get('attackPct', 0) + mana_attack
                          rows.extend({'key': key, 'value': value} for key, value in ex.items())
                      if element in elements and element != 'physical' and not any(x.get('key') == 'basicElement' for x in rows):
                          rows.append({'key':'basicElement','value':element})
                      if not rows:
                          rows = [{'key':'flatAttack','value':0}]
                      form['fixedEffects'] = rows[:5]
                      for key in ['atk','hp','def','mp','mpRegen','crit','critDamage','pierce','lifesteal','evasion','elementBonus','defenseIgnore','exclusive','element']:
                          form.pop(key, None)
                      affected.append((job, slot, index, form.get('name'), element))

          if len(affected) != 5:
              raise SystemExit(f'expected 5 legacy form-level elements, got {len(affected)}: {affected}')
          for slots in data.get('equipmentForms', []):
              for forms in slots or []:
                  for form in forms or []:
                      if isinstance(form, dict) and 'element' in form:
                          raise SystemExit('embedded equipmentForms still contains top-level element')

          note = '武器攻擊屬性唯一來源為 equipmentForms.fixedEffects 的 basicElement；equipmentForms[].element 已移除，舊 element 僅在匯入時轉換為 basicElement 後刪除。'
          notes = data.setdefault('notes', [])
          if note not in notes:
              notes.append(note)
          encoded = base64.b64encode(json.dumps(data, ensure_ascii=False, separators=(',', ':')).encode('utf-8')).decode('ascii')
          text = text[:m.start(1)] + encoded + text[m.end(1):]

          old = '{key:\"basicElement\",label:\"普通攻擊屬性\",unit:\"屬性\",help:\"把普通攻擊改為指定元素。\"}'
          new = '{key:\"basicElement\",label:\"此武器攻擊屬性\",unit:\"屬性\",help:\"武器自身攻擊屬性的唯一來源。設定後普通攻擊使用指定元素；不再使用 equipmentForms[].element。\"}'
          if text.count(old) != 1:
              raise SystemExit(f'basicElement definition anchor count: {text.count(old)}')
          text = text.replace(old, new)

          anchor = '  if(!rows.length)rows=[{key:\"flatAttack\",value:0}];\n  form.fixedEffects=rows;'
          replacement = '  if(ELEMENTS.includes(form.element)&&form.element!==\"physical\"&&!rows.some(x=>x.key===\"basicElement\"))rows.unshift({key:\"basicElement\",value:form.element});\n  if(rows.length>5)rows=rows.slice(0,5);\n  if(!rows.length)rows=[{key:\"flatAttack\",value:0}];\n  form.fixedEffects=rows;'
          if text.count(anchor) != 1:
              raise SystemExit(f'normalizer anchor count: {text.count(anchor)}')
          text = text.replace(anchor, replacement)

          old = '<div class=\"mini-note\"><b>基底規則：</b>每件裝備可設定 1～5 條固定屬性；目前所有裝備屬性皆可選，尚未依部位限制。</div>'
          new = '<div class=\"mini-note\"><b>基底規則：</b>每件裝備可設定 1～5 條固定屬性；目前所有裝備屬性皆可選，尚未依部位限制。<br><b>武器攻擊屬性：</b>唯一來源為固定屬性「此武器攻擊屬性」（basicElement）。equipmentForms[].element 已移除；舊 element 匯入時只會轉換為 basicElement，之後立即刪除。</div>'
          if text.count(old) != 1:
              raise SystemExit(f'equipment notice anchor count: {text.count(old)}')
          text = text.replace(old, new)
          text = text.replace('的普通攻擊屬性無效。','的此武器攻擊屬性無效。')

          path.write_text(text, encoding='utf-8')

          # Re-decode the written payload as a final round-trip check.
          written = path.read_text(encoding='utf-8')
          mm = re.search(r'const ORIGINAL_B64\s*=\s*"([A-Za-z0-9+/=]+)";', written)
          check = json.loads(base64.b64decode(mm.group(1)).decode('utf-8'))
          by_name = {}
          for slots in check['equipmentForms']:
              for forms in slots:
                  for form in forms:
                      by_name[form.get('name')] = form
          expected = {'炎晶杖':'fire','霜紋杖':'ice','疾風法器':'wind','風羽短弓':'wind','晨光權杖':'light'}
          for name, element in expected.items():
              form = by_name.get(name)
              if not form:
                  raise SystemExit(f'missing form {name}')
              if 'element' in form:
                  raise SystemExit(f'{name} still has top-level element')
              if not any(x.get('key')=='basicElement' and x.get('value')==element for x in form.get('fixedEffects', [])):
                  raise SystemExit(f'{name} missing basicElement {element}')
          if 'label:\"此武器攻擊屬性\"' not in written or 'equipmentForms[].element 已移除' not in written:
              raise SystemExit('editor documentation update missing')
          print('Migrated forms:', affected)
          PY
          git diff --check

      - name: Commit editor migration
        shell: bash
        run: |
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-basic-element-editor-migration.yml
          git add balance-editor.html
          git commit -m "fix: make basicElement the sole weapon element source"
          git push origin HEAD:main
