name: Inspect balance editor extension points

on:
  push:
    branches: [main]
    paths: [.github/workflows/inspect-balance-editor.yml]

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Extract relevant snippets
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text=Path('balance-editor.html').read_text(encoding='utf-8')
          keys=['statusDefinitions','statusTarget','supportSkills','STATUS_SCHEMA_VERSION','STATUS_TAGS','renderStatus','狀態製作器','技能效果','effectPerLevel','function render']
          out=[]
          for key in keys:
              out.append('\n===== '+key+' =====\n')
              start=0
              found=0
              while True:
                  i=text.find(key,start)
                  if i<0 or found>=8: break
                  a=max(0,i-1800); b=min(len(text),i+3600)
                  out.append(text[a:b])
                  out.append('\n---\n')
                  start=i+len(key); found+=1
              if not found: out.append('(not found)\n')
          Path('.github/balance-inspect.txt').write_text(''.join(out),encoding='utf-8')
          PY
      - name: Commit inspection result and remove workflow
        shell: bash
        run: |
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/inspect-balance-editor.yml
          git add .github/balance-inspect.txt
          git commit -m "chore: capture balance editor extension points"
          git push origin HEAD:main
