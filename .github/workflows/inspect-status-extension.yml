name: Inspect status editor scope
on:
  push:
    branches: [main]
    paths: [.github/workflows/inspect-status-extension.yml]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: |
          grep -n -C 55 -E 'statusValidateDataBase|function renderStatuses|statusRenderSkillsBase|STATUS_PURE_START' balance-editor.html || true
