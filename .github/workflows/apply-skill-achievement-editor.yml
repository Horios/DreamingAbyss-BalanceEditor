name: Apply skill achievement editor migration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply migration
        run: python3 .github/scripts/skill-achievement-editor-migration.py
      - name: Validate editor
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64,json,re,subprocess,tempfile
          text=Path('balance-editor.html').read_text(encoding='utf-8')
          assert 'skill-achievement-unlock-editor-v1' in text
          assert 'skillAddBossKill' in text
          assert 'skillAddEliteKill' in text
          assert 'skillAddBossEquipment' in text
          assert 'obj.balanceSettings.progression.starting.skillPoints=0' not in text
          assert 'obj.balanceSettings.progression.levelRewards.skillPoints=0' not in text
          m=re.search(r'const ORIGINAL_B64\s*=\s*"([A-Za-z0-9+/=]+)";',text); assert m
          doc=json.loads(base64.b64decode(m.group(1)).decode('utf-8'))
          assert 'skillPoints' not in doc['balanceSettings']['progression']['starting']
          assert 'skillPoints' not in doc['balanceSettings']['progression']['levelRewards']
          for job in range(4):
              assert doc['classes'][job]['skills'][4]['unlockConditions']['bossKills']==[{'mapIndex':2,'count':1}]
              assert doc['classes'][job]['skills'][5]['unlockConditions']['bossEquipment']==[{'mapIndex':3,'quantity':1}]
              assert doc['supportSkills'][job][2]['unlockConditions']['eliteKills']==[{'mapIndex':2,'count':10}]
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,re.S)
          for i,src in enumerate(scripts):
              if not src.strip() or src.lstrip().startswith(('{','[')): continue
              tmp=Path(tempfile.gettempdir())/f'emberwild-balance-{i}.js'
              tmp.write_text(src,encoding='utf-8')
              subprocess.run(['node','--check',str(tmp)],check=True)
          PY
          git diff --check
      - name: Commit editor
        run: |
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/apply-skill-achievement-editor.yml .github/scripts/skill-achievement-editor-migration.py .github/scripts/team-model-source.js .github/balance-inspect.txt .github/skill-editor-inspect.txt
          git add balance-editor.html
          git commit -m "feat: configure achievement-gated player skills"
          git push origin HEAD:main
